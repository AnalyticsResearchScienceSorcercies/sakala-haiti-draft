<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Konkret — Leson</title>
<style>
/* ============================================================
   THE LESSON STYLE. Written once, inherited by every lesson
   ever created, the same bargain the form renderer makes:
   nobody using the builder touches CSS, so nobody can make an
   ugly lesson. Change it here, every lesson changes.

   Built for a phone held in one hand on a bad connection. One
   slide fills the screen, the controls sit under the thumb, and
   nothing needs a pinch or a sideways scroll.
   ============================================================ */
:root{
  --ink:#12100e; --paper:#fbf9f5; --line:#d9d2c6; --card:#fff;
  --accent:#8a1c1c; --ok:#1f6f3d; --muted:#6b645c;
  --r:8px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);
 font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 display:flex;flex-direction:column;
 /* the notch, and the home bar under the controls */
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* #app has to be a flex column too, not just body. The header, the deck and
   the controls are its children, not body's, so `main{flex:1}` was landing on
   a non-flex-item and doing nothing: the column collapsed to its content and
   the controls sat wherever the slide happened to end. On a phone that means
   the Next button moves under the reader's thumb every time the slide length
   changes, which is the one thing a control bar must never do.
   min-height:0 so the scrolling deck can actually shrink inside it. */
#app{flex:1;display:flex;flex-direction:column;min-height:0}
#app[hidden]{display:none}

/* ---------------------------------------------------------- chrome */
header{border-bottom:1px solid var(--line);padding:12px 16px;flex:none;
 display:flex;align-items:baseline;gap:10px;background:var(--paper)}
header .t{font-weight:700;font-size:15px;letter-spacing:-.01em;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .n{margin-left:auto;color:var(--muted);font-size:13px;flex:none;
 font-variant-numeric:tabular-nums}

/* The progress bar is the whole navigation model: a trainee can see how
   much is left before they start, which is the thing that decides whether
   they start. */
.bar{height:4px;background:var(--line);flex:none}
.bar span{display:block;height:100%;background:var(--ink);width:0;
 transition:width .25s ease}

/* ---------------------------------------------------------- the deck */
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.slide{max-width:660px;margin:0 auto;padding:28px 20px 40px;
 animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide{animation:none}.bar span{transition:none}}

.slide h2{font-size:25px;line-height:1.25;margin:0 0 16px;letter-spacing:-.015em}
.slide p{margin:0 0 16px}
.slide p:last-child{margin-bottom:0}

/* tit ... the cover */
.slide.tit{display:flex;flex-direction:column;justify-content:center;
 min-height:60vh;text-align:center}
.slide.tit h2{font-size:32px;margin-bottom:10px}
.slide.tit .sou{color:var(--muted);font-size:17px}
.slide.tit .kal{font-size:13px;font-weight:700;letter-spacing:.08em;
 text-transform:uppercase;color:var(--accent);margin-bottom:14px}

/* pwen ... a list that is the point, not decoration */
ul.pwen{list-style:none;margin:0;padding:0}
ul.pwen li{position:relative;padding:0 0 0 30px;margin:0 0 15px;font-size:17px}
ul.pwen li:last-child{margin-bottom:0}
ul.pwen li::before{content:"";position:absolute;left:6px;top:.62em;
 width:9px;height:9px;background:var(--ink);border-radius:2px;transform:rotate(45deg)}
ul.pwen.nimewo{counter-reset:p}
ul.pwen.nimewo li{counter-increment:p;padding-left:38px}
ul.pwen.nimewo li::before{content:counter(p);background:none;transform:none;
 left:0;top:0;width:26px;height:26px;border:2px solid var(--ink);border-radius:50%;
 display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}

/* videyo ... 16:9, no layout jump while it loads */
.vid{position:relative;width:100%;aspect-ratio:16/9;background:#000;
 border-radius:var(--r);overflow:hidden;margin:0 0 16px}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
/* Facade: the iframe is only inserted on tap. Three modules of embeds would
   otherwise load three players on open, on someone else's phone data. */
.vid .poster{position:absolute;inset:0;display:flex;align-items:center;
 justify-content:center;cursor:pointer;background:#1a1714;color:#fbf9f5}
.vid .poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.62}
.vid .play{position:relative;width:66px;height:66px;border-radius:50%;
 background:rgba(251,249,245,.94);display:flex;align-items:center;justify-content:center}
.vid .play::after{content:"";border-left:20px solid var(--ink);
 border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:5px}
.vid .lbl{position:absolute;left:0;right:0;bottom:0;padding:9px 12px;font-size:13px;
 background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;text-align:center}

/* imaj */
.slide img.fig{width:100%;height:auto;border-radius:var(--r);
 border:1px solid var(--line);display:block;margin:0 0 12px}
.kap{color:var(--muted);font-size:14px;margin:0}

/* sitasyon ... the voice of somebody in the field */
blockquote{margin:0;padding:2px 0 2px 18px;border-left:4px solid var(--accent);
 font-size:19px;line-height:1.5}
blockquote .ki{display:block;margin-top:12px;font-size:14px;color:var(--muted);
 font-style:normal}

/* atansyon ... the one thing on the slide that must not be missed */
.atansyon{border:1px solid var(--accent);border-left-width:5px;border-radius:var(--r);
 background:#fdf6f4;padding:14px 16px;margin:0 0 16px}
.atansyon .h{font-weight:700;font-size:13px;letter-spacing:.06em;
 text-transform:uppercase;color:var(--accent);margin:0 0 6px}

/* fen ... the handoff to the gate form */
.slide.fen{text-align:center;min-height:52vh;display:flex;
 flex-direction:column;justify-content:center}
a.go{display:block;padding:16px;background:var(--ink);color:var(--paper);
 text-decoration:none;border-radius:var(--r);font-size:18px;font-weight:700;
 margin-top:22px}
a.go:active{transform:translateY(1px)}

/* ---------------------------------------------------------- controls */
nav{flex:none;border-top:1px solid var(--line);background:var(--paper);
 padding:10px 12px calc(10px + env(safe-area-inset-bottom));
 display:flex;gap:10px;align-items:center}
nav button{flex:1;padding:14px;border:1px solid var(--ink);background:var(--card);
 color:var(--ink);border-radius:var(--r);font-size:16px;font-weight:700;
 font-family:inherit;cursor:pointer}
nav button.pri{background:var(--ink);color:var(--paper)}
nav button:disabled{opacity:.32;cursor:default}
nav button:active:not(:disabled){transform:translateY(1px)}

.mid{flex:none;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;
 min-width:52px;text-align:center}

/* ---------------------------------------------------------- states */
.msg{max-width:560px;margin:14vh auto;padding:0 24px;text-align:center}
.msg h1{font-size:20px;margin:0 0 8px}
.msg p{color:var(--muted);margin:0}
.draft{background:#fff6e0;border-bottom:1px solid #b07d1a;color:#7a5610;
 padding:8px 16px;font-size:13px;font-weight:700;text-align:center;flex:none}

/* ---------------------------------------------------------- script mode
   ?mod=eskript lays the whole deck out vertically at reading size, for the
   person standing in front of the camera. It is the same deck, not a second
   document -- the thing that gets filmed and the thing the trainee opens can
   never drift, because they are one row in one table. */
body.eskript{display:block;padding:0 0 80px}
body.eskript nav,body.eskript .bar,body.eskript header{display:none}
body.eskript main{overflow:visible}
.sk{max-width:760px;margin:0 auto;padding:24px 22px}
.sk h1{font-size:27px;margin:0 0 4px;letter-spacing:-.02em}
.sk .meta{color:var(--muted);font-size:14px;margin:0 0 4px}
.sk .card{border:1px solid var(--line);border-radius:var(--r);background:var(--card);
 padding:20px 22px;margin:0 0 16px}
.sk .card > .no{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
 color:var(--muted);margin:0 0 10px;display:flex;gap:10px;align-items:baseline}
.sk .card > .no b{color:var(--accent)}
.sk .say{font-size:21px;line-height:1.5}
.sk .say h2{font-size:23px;margin:0 0 12px}
.sk .say ul.pwen li{font-size:20px}
.sk .kam{margin:14px 0 0;padding:11px 14px;border-left:4px solid var(--ok);
 background:#f1f7f2;border-radius:0 var(--r) var(--r) 0;font-size:15px;color:#1b4a2c}
.sk .kam b{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
 margin-bottom:3px}
.sk .tools{display:flex;gap:10px;margin:0 0 20px;flex-wrap:wrap}
.sk .tools a{display:inline-block;padding:10px 16px;border:1px solid var(--ink);
 border-radius:var(--r);text-decoration:none;color:var(--ink);font-weight:700;font-size:15px}
.sk .tools a.pri{background:var(--ink);color:var(--paper)}
@media print{
  .sk .tools,.draft{display:none}
  .sk .card{break-inside:avoid;border-color:#bbb}
  .sk .kam{break-inside:avoid}
  body{background:#fff}
}
</style>
</head>
<body>

<div id="app" hidden>
  <header><span class="t" id="tit"></span><span class="n" id="num"></span></header>
  <div class="bar"><span id="prog"></span></div>
  <div id="draft" class="draft" hidden>BOUYON ... leson sa a poko pare pou piblik la</div>
  <main id="main"></main>
  <nav>
    <button id="prev" type="button">← Anvan</button>
    <span class="mid" id="mid"></span>
    <button id="next" type="button" class="pri">Apre →</button>
  </nav>
</div>

<div id="state" class="msg"><h1>N ap chaje leson an…</h1></div>

<script>
(function () {
  "use strict";

  var API = "https://itnmcxemdpauemsnesln.supabase.co/functions/v1/l";
  var FORM = "/f/?s=";

  var qs = new URLSearchParams(location.search);
  var SLUG = (qs.get("s") || "").trim();
  var PREVIEW = qs.get("prevyou") === "1";
  var SCRIPT = qs.get("mod") === "eskript";

  var app = document.getElementById("app");
  var state = document.getElementById("state");
  var main = document.getElementById("main");
  var prog = document.getElementById("prog");
  var mid = document.getElementById("mid");
  var num = document.getElementById("num");
  var bPrev = document.getElementById("prev");
  var bNext = document.getElementById("next");

  var SLIDES = [];
  var i = 0;

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // Deliberately tiny: bold, and paragraph breaks. Not a markdown engine.
  // A lesson author who needs more structure needs another slide, not more
  // syntax -- that is the whole reason slides exist.
  function rich(s) {
    return esc(s)
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .split(/\n{2,}/).map(function (p) {
        return "<p>" + p.replace(/\n/g, "<br>") + "</p>";
      }).join("");
  }

  // A YouTube id, and nothing that is not one. The builder stores an id, but
  // people paste whole URLs, so accept a URL and keep only the id. Anything
  // else yields "" and the slide says so rather than framing a stranger's page.
  function ytId(v) {
    var s = String(v || "").trim();
    if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
    var m = s.match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/)([A-Za-z0-9_-]{11})/);
    return m ? m[1] : "";
  }

  function slideHtml(s) {
    var t = String(s.type || "teks");

    if (t === "tit") {
      return '<section class="slide tit">' +
        (s.kalite ? '<div class="kal">' + esc(s.kalite) + "</div>" : "") +
        "<h2>" + esc(s.tit) + "</h2>" +
        (s.sou_tit ? '<p class="sou">' + esc(s.sou_tit) + "</p>" : "") +
        "</section>";
    }

    if (t === "pwen") {
      var cls = s.nimewo ? "pwen nimewo" : "pwen";
      var li = (s.pwen || []).map(function (p) { return "<li>" + rich(p).replace(/^<p>|<\/p>$/g, "") + "</li>"; }).join("");
      return '<section class="slide">' +
        (s.tit ? "<h2>" + esc(s.tit) + "</h2>" : "") +
        '<ul class="' + cls + '">' + li + "</ul>" +
        (s.atansyon ? atansyon(s.atansyon) : "") +
        "</section>";
    }

    if (t === "videyo") {
      var id = ytId(s.youtube);
      var body = id
        ? '<div class="vid" data-yt="' + id + '"' + (s.komanse ? ' data-t="' + (parseInt(s.komanse, 10) || 0) + '"' : "") + '>' +
            '<div class="poster">' +
              '<img loading="lazy" alt="" src="https://i.ytimg.com/vi/' + id + '/hqdefault.jpg">' +
              '<div class="play"></div>' +
              '<div class="lbl">Tape pou w gade</div>' +
            "</div></div>"
        : '<div class="atansyon"><div class="h">Videyo</div>' +
            "<p>Videyo sa a poko mete.</p></div>";
      return '<section class="slide">' +
        (s.tit ? "<h2>" + esc(s.tit) + "</h2>" : "") + body +
        (s.ko ? rich(s.ko) : "") + "</section>";
    }

    if (t === "imaj") {
      return '<section class="slide">' +
        (s.tit ? "<h2>" + esc(s.tit) + "</h2>" : "") +
        (s.url ? '<img class="fig" loading="lazy" alt="' + esc(s.alt || "") + '" src="' + esc(s.url) + '">' : "") +
        (s.kap ? '<p class="kap">' + esc(s.kap) + "</p>" : "") +
        "</section>";
    }

    if (t === "sitasyon") {
      return '<section class="slide"><blockquote>' + rich(s.teks) +
        (s.ki_moun ? '<span class="ki">' + esc(s.ki_moun) + "</span>" : "") +
        "</blockquote></section>";
    }

    if (t === "fen") {
      // The join between the two engines. A lesson ends by handing the trainee
      // the gate that unlocks the next one; the slug is all it takes.
      var href = s.fom ? FORM + encodeURIComponent(s.fom) : (s.lyen || "");
      return '<section class="slide fen">' +
        "<h2>" + esc(s.tit || "Ou fini leson an") + "</h2>" +
        (s.ko ? rich(s.ko) : "") +
        (href ? '<a class="go" href="' + esc(href) + '">' + esc(s.bouton || "Kòmanse travay la") + "</a>" : "") +
        "</section>";
    }

    // teks, and the fallback for anything a future builder invents
    return '<section class="slide">' +
      (s.tit ? "<h2>" + esc(s.tit) + "</h2>" : "") +
      (s.ko ? rich(s.ko) : "") +
      (s.atansyon ? atansyon(s.atansyon) : "") +
      "</section>";
  }

  function atansyon(a) {
    var o = typeof a === "string" ? { ko: a } : (a || {});
    return '<div class="atansyon"><div class="h">' + esc(o.tit || "Atansyon") + "</div>" +
      rich(o.ko) + "</div>";
  }

  // Everything, laid out vertically, at a size you can read from a metre away
  // with a phone on a tripod. Camera notes are visible HERE and nowhere else:
  // the trainee opening the same lesson never sees them.
  function drawScript(d) {
    document.body.classList.add("eskript");
    var mins = Math.max(1, Math.round(SLIDES.length * 0.4));
    var cards = SLIDES.map(function (s, n) {
      var body = slideHtml(s).replace(/^<section class="slide[^"]*">/, "").replace(/<\/section>$/, "");
      // The video slide is where the camera points at itself. Nothing to read.
      if (s.type === "videyo") {
        body = "<h2>" + esc(s.tit || "Video") + "</h2>" +
          "<p><em>This slide holds the finished video. Nothing to say here.</em></p>";
      }
      return '<div class="card"><p class="no"><span>Slide ' + (n + 1) + " of " + SLIDES.length +
        "</span> <b>" + esc(kindName(s.type)) + "</b></p>" +
        '<div class="say">' + body + "</div>" +
        (s.not_kamera
          ? '<div class="kam"><b>To camera</b>' + rich(s.not_kamera) + "</div>"
          : "") + "</div>";
    }).join("");

    var back = "/l/?s=" + encodeURIComponent(SLUG) + (PREVIEW ? "&prevyou=1" : "");
    document.getElementById("state").hidden = true;
    app.hidden = false;
    app.innerHTML = '<div class="sk">' +
      "<h1>" + esc(d.tit) + "</h1>" +
      '<p class="meta">Filming script &middot; ' + SLIDES.length + " slides &middot; about " +
      mins + " minute" + (mins === 1 ? "" : "s") + " read aloud &middot; " + esc(d.lang) + "</p>" +
      '<div class="tools"><a class="pri" href="' + back + '">Open as slides</a>' +
      '<a href="#" id="prn">Print / save PDF</a></div>' +
      cards + "</div>";
    var pr = document.getElementById("prn");
    if (pr) pr.onclick = function (e) { e.preventDefault(); window.print(); };
  }

  function kindName(t) {
    var m = { tit:"Cover", teks:"Text", pwen:"Points", videyo:"Video",
              imaj:"Image", sitasyon:"Quote", fen:"Ending" };
    return m[t] || t;
  }

  function draw() {
    main.innerHTML = slideHtml(SLIDES[i]);
    main.scrollTop = 0;
    var pct = SLIDES.length < 2 ? 100 : (i / (SLIDES.length - 1)) * 100;
    prog.style.width = pct + "%";
    mid.textContent = (i + 1) + " / " + SLIDES.length;
    num.textContent = (i + 1) + " / " + SLIDES.length;
    bPrev.disabled = i === 0;
    bNext.disabled = i === SLIDES.length - 1;
    // Position is remembered per lesson, so closing WhatsApp mid-lesson and
    // coming back does not start over. Wrapped: a private window throws here.
    try { localStorage.setItem("leson:" + SLUG, String(i)); } catch (e) { /* fine */ }
    wireVideo();
  }

  // The player is only built on tap. Before that the slide is a thumbnail,
  // which costs a few KB instead of a few hundred.
  function wireVideo() {
    var v = main.querySelector(".vid[data-yt]");
    if (!v) return;
    var poster = v.querySelector(".poster");
    if (!poster) return;
    poster.addEventListener("click", function () {
      var id = v.getAttribute("data-yt");
      var t = v.getAttribute("data-t");
      var fr = document.createElement("iframe");
      fr.setAttribute("allow", "accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen");
      fr.setAttribute("allowfullscreen", "");
      fr.setAttribute("title", "Videyo");
      // nocookie, and no related videos from other channels at the end.
      fr.src = "https://www.youtube-nocookie.com/embed/" + id +
        "?autoplay=1&rel=0&modestbranding=1&playsinline=1" + (t ? "&start=" + t : "");
      v.innerHTML = "";
      v.appendChild(fr);
    }, { once: true });
  }

  function go(d) {
    var n = i + d;
    if (n < 0 || n >= SLIDES.length) return;
    i = n;
    draw();
  }

  bPrev.addEventListener("click", function () { go(-1); });
  bNext.addEventListener("click", function () { go(1); });

  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight" || e.key === "PageDown") go(1);
    else if (e.key === "ArrowLeft" || e.key === "PageUp") go(-1);
  });

  // Swipe. Horizontal only, and only when the gesture is clearly sideways --
  // otherwise a thumb scrolling a long text slide would page the deck.
  var x0 = null, y0 = null;
  main.addEventListener("touchstart", function (e) {
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, { passive: true });
  main.addEventListener("touchend", function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    var dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.7) go(dx < 0 ? 1 : -1);
    x0 = y0 = null;
  }, { passive: true });

  function fail(h, p) {
    state.innerHTML = "<h1>" + esc(h) + "</h1>" + (p ? "<p>" + esc(p) + "</p>" : "");
    state.hidden = false;
    app.hidden = true;
  }

  if (!SLUG) { fail("Ki leson?", "Lyen an pa konplè."); return; }

  fetch(API + "/" + encodeURIComponent(SLUG) + (PREVIEW ? "?prevyou=1" : ""))
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (res) {
      if (!res.ok) { fail("Nou pa jwenn leson an", res.j && res.j.error); return; }
      var d = res.j;
      SLIDES = (d.deck && d.deck.slides) || [];
      if (!SLIDES.length) { fail("Leson an vid", "Pa gen anyen ladan l pou kounye a."); return; }

      document.getElementById("tit").textContent = d.tit || "";
      document.title = (d.tit || "Leson") + " — Konkret";
      document.getElementById("draft").hidden = d.eta === "live";
      if (d.lang) document.documentElement.lang = d.lang === "EN" ? "en" : d.lang === "FR" ? "fr" : "ht";

      // Resume where they stopped, but never past the end if the deck shrank.
      try {
        var was = parseInt(localStorage.getItem("leson:" + SLUG) || "0", 10);
        if (was > 0 && was < SLIDES.length) i = was;
      } catch (e) { /* fine */ }

      if (SCRIPT) { drawScript(d); return; }

      state.hidden = true;
      app.hidden = false;
      draw();
    })
    .catch(function () {
      fail("Koneksyon an pa mache", "Tanpri eseye ankò lè entènèt la tounen.");
    });
})();
</script>
</body>
</html>
