<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Konkret — Leson</title>
<style>
/* ============================================================
   THE LESSON STYLE. Written once, inherited by every lesson
   ever created, the same bargain the form renderer makes:
   nobody using the builder touches CSS, so nobody can make an
   ugly lesson. Change it here, every lesson changes.

   Built for a phone held in one hand on a bad connection. One
   slide fills the screen, the controls sit under the thumb, and
   nothing needs a pinch or a sideways scroll.
   ============================================================ */
:root{
  --ink:#12100e; --paper:#fbf9f5; --line:#d9d2c6; --card:#fff;
  --accent:#8a1c1c; --ok:#1f6f3d; --muted:#6b645c;
  --r:8px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);
 font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 display:flex;flex-direction:column;
 /* the notch, and the home bar under the controls */
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* #app has to be a flex column too, not just body. The header, the deck and
   the controls are its children, not body's, so `main{flex:1}` was landing on
   a non-flex-item and doing nothing: the column collapsed to its content and
   the controls sat wherever the slide happened to end. On a phone that means
   the Next button moves under the reader's thumb every time the slide length
   changes, which is the one thing a control bar must never do.
   min-height:0 so the scrolling deck can actually shrink inside it. */
#app{flex:1;display:flex;flex-direction:column;min-height:0}
#app[hidden]{display:none}

/* ---------------------------------------------------------- chrome */
header{border-bottom:1px solid var(--line);padding:12px 16px;flex:none;
 display:flex;align-items:baseline;gap:10px;background:var(--paper)}
header .t{font-weight:700;font-size:15px;letter-spacing:-.01em;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .n{margin-left:auto;color:var(--muted);font-size:13px;flex:none;
 font-variant-numeric:tabular-nums}
/* Two auto margins would split the free space between them. Once the reading
   link is showing it takes the gap, and the counter just sits beside it. */
header .rd:not([hidden]) ~ .n{margin-left:10px}
/* The way out of the deck and into the document. It sits in the header rather
   than at the end of the deck because the reason to want it arrives early:
   somebody who cannot swipe thirteen slides right now needs to know on slide
   one that they do not have to. Hidden when there is no reading version. */
header .rd{margin-left:auto;flex:none;font-size:12.5px;font-weight:700;
 text-decoration:none;color:var(--muted);border:1px solid var(--line);
 border-radius:999px;padding:4px 12px;background:var(--card)}
header .rd[hidden]{display:none}
header .rd:active{transform:translateY(1px)}

/* The progress bar is the whole navigation model: a trainee can see how
   much is left before they start, which is the thing that decides whether
   they start. */
.bar{height:4px;background:var(--line);flex:none}
.bar span{display:block;height:100%;background:var(--ink);width:0;
 transition:width .25s ease}

/* ---------------------------------------------------------- the deck */
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.slide{max-width:660px;margin:0 auto;padding:28px 20px 40px;
 animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide{animation:none}.bar span{transition:none}}

.slide h2{font-size:25px;line-height:1.25;margin:0 0 16px;letter-spacing:-.015em}
.slide p{margin:0 0 16px}
.slide p:last-child{margin-bottom:0}

/* tit ... the cover */
.slide.tit{display:flex;flex-direction:column;justify-content:center;
 min-height:60vh;text-align:center}
.slide.tit h2{font-size:32px;margin-bottom:10px}
.slide.tit .sou{color:var(--muted);font-size:17px}
.slide.tit .kal{font-size:13px;font-weight:700;letter-spacing:.08em;
 text-transform:uppercase;color:var(--accent);margin-bottom:14px}

/* pwen ... a list that is the point, not decoration */
ul.pwen{list-style:none;margin:0;padding:0}
ul.pwen li{position:relative;padding:0 0 0 30px;margin:0 0 15px;font-size:17px}
ul.pwen li:last-child{margin-bottom:0}
ul.pwen li::before{content:"";position:absolute;left:6px;top:.62em;
 width:9px;height:9px;background:var(--ink);border-radius:2px;transform:rotate(45deg)}
ul.pwen.nimewo{counter-reset:p}
ul.pwen.nimewo li{counter-increment:p;padding-left:38px}
ul.pwen.nimewo li::before{content:counter(p);background:none;transform:none;
 left:0;top:0;width:26px;height:26px;border:2px solid var(--ink);border-radius:50%;
 display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}

/* videyo ... 16:9, no layout jump while it loads */
.vid{position:relative;width:100%;aspect-ratio:16/9;background:#000;
 border-radius:var(--r);overflow:hidden;margin:0 0 16px}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
/* Facade: the iframe is only inserted on tap. Three modules of embeds would
   otherwise load three players on open, on someone else's phone data. */
.vid .poster{position:absolute;inset:0;display:flex;align-items:center;
 justify-content:center;cursor:pointer;background:#1a1714;color:#fbf9f5}
.vid .poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.62}
.vid .play{position:relative;width:66px;height:66px;border-radius:50%;
 background:rgba(251,249,245,.94);display:flex;align-items:center;justify-content:center}
.vid .play::after{content:"";border-left:20px solid var(--ink);
 border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:5px}
.vid .lbl{position:absolute;left:0;right:0;bottom:0;padding:9px 12px;font-size:13px;
 background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;text-align:center}

/* imaj */
.slide img.fig{width:100%;height:auto;border-radius:var(--r);
 border:1px solid var(--line);display:block;margin:0 0 12px}
.kap{color:var(--muted);font-size:14px;margin:0}

/* sitasyon ... the voice of somebody in the field */
blockquote{margin:0;padding:2px 0 2px 18px;border-left:4px solid var(--accent);
 font-size:19px;line-height:1.5}
blockquote .ki{display:block;margin-top:12px;font-size:14px;color:var(--muted);
 font-style:normal}

/* atansyon ... the one thing on the slide that must not be missed */
.atansyon{border:1px solid var(--accent);border-left-width:5px;border-radius:var(--r);
 background:#fdf6f4;padding:14px 16px;margin:0 0 16px}
.atansyon .h{font-weight:700;font-size:13px;letter-spacing:.06em;
 text-transform:uppercase;color:var(--accent);margin:0 0 6px}

/* fen ... the handoff to the gate form */
.slide.fen{text-align:center;min-height:52vh;display:flex;
 flex-direction:column;justify-content:center}
a.go{display:block;padding:16px;background:var(--ink);color:var(--paper);
 text-decoration:none;border-radius:var(--r);font-size:18px;font-weight:700;
 margin-top:22px}
a.go:active{transform:translateY(1px)}

/* ---------------------------------------------------------- controls */
nav{flex:none;border-top:1px solid var(--line);background:var(--paper);
 padding:10px 12px calc(10px + env(safe-area-inset-bottom));
 display:flex;gap:10px;align-items:center}
nav button{flex:1;padding:14px;border:1px solid var(--ink);background:var(--card);
 color:var(--ink);border-radius:var(--r);font-size:16px;font-weight:700;
 font-family:inherit;cursor:pointer}
nav button.pri{background:var(--ink);color:var(--paper)}
nav button:disabled{opacity:.32;cursor:default}
nav button:active:not(:disabled){transform:translateY(1px)}

.mid{flex:none;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;
 min-width:52px;text-align:center}

/* ---------------------------------------------------------- states */
.msg{max-width:560px;margin:14vh auto;padding:0 24px;text-align:center}
.msg h1{font-size:20px;margin:0 0 8px}
.msg p{color:var(--muted);margin:0}
.draft{background:#fff6e0;border-bottom:1px solid #b07d1a;color:#7a5610;
 padding:8px 16px;font-size:13px;font-weight:700;text-align:center;flex:none}

/* ---------------------------------------------------------- reading mode
   ?mod=liv is the manual text, and it exists because a slide deck is a bad
   way to look something up. A trainee mid-conversation with a parent cannot
   swipe through thirteen slides to find the sentence about the share. The
   deck is for learning it once; this is for finding it again.

   Same blocks, same row, drawn continuously instead of paged, so the two can
   never drift. Serif body on purpose: it is a document, and it should look
   like one and print like one. No webfont ... this opens on phone data.
   ============================================================ */
body.liv{display:block;padding:0}
body.liv #app{display:block;flex:none;min-height:0}
body.liv nav,body.liv .bar,body.liv header{display:none}
body.liv main{overflow:visible}

/* the reading bar: how much is left, which is what decides whether they start */
.lvtop{position:sticky;top:0;z-index:20;background:var(--paper);
 border-bottom:1px solid var(--line)}
.lvtop .in{max-width:720px;margin:0 auto;padding:10px 20px;
 display:flex;align-items:center;gap:12px}
.lvtop .t{font-weight:700;font-size:14px;letter-spacing:-.01em;flex:1;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvtop .sw{flex:none;display:flex;border:1px solid var(--line);border-radius:999px;
 overflow:hidden;background:var(--card)}
.lvtop .sw a{padding:5px 13px;font-size:12.5px;font-weight:700;text-decoration:none;
 color:var(--muted);letter-spacing:.01em}
.lvtop .sw a.on{background:var(--ink);color:var(--paper)}
.lvbar{height:3px;background:var(--line)}
.lvbar span{display:block;height:100%;background:var(--accent);width:0}

.lv{max-width:720px;margin:0 auto;padding:34px 20px 90px}
.lv .kal{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
 color:var(--accent);margin:0 0 12px}
.lv h1{font-size:34px;line-height:1.15;letter-spacing:-.025em;margin:0 0 12px}
.lv .dek{color:var(--muted);font-size:18px;line-height:1.5;margin:0 0 18px;
 font-family:Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif}
.lv .meta{color:var(--muted);font-size:13px;margin:0;padding:14px 0 0;
 border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;
 align-items:center;font-variant-numeric:tabular-nums}
.lv .meta b{color:var(--ink)}

/* contents. Built from the block titles, so it costs nothing to maintain and
   cannot fall out of step with the document it indexes. */
.lv .toc{margin:22px 0 0;border:1px solid var(--line);border-radius:var(--r);
 background:var(--card);overflow:hidden}
.lv .toc > summary{padding:13px 16px;cursor:pointer;font-weight:700;font-size:13px;
 letter-spacing:.06em;text-transform:uppercase;color:var(--muted);list-style:none}
.lv .toc > summary::-webkit-details-marker{display:none}
.lv .toc > summary::after{content:"›";float:right;display:inline-block;
 transform:rotate(90deg);transform-origin:50% 45%;
 transition:transform .18s ease;font-size:19px;line-height:1;font-weight:400}
.lv .toc[open] > summary::after{transform:rotate(-90deg)}
.lv .toc ol{margin:0;padding:0 16px 14px 16px;list-style:none;counter-reset:tc}
.lv .toc li{counter-increment:tc;border-top:1px solid var(--line)}
.lv .toc a{display:flex;gap:11px;padding:10px 2px;text-decoration:none;
 color:var(--ink);font-size:15.5px;line-height:1.35}
.lv .toc a:hover{color:var(--accent)}
.lv .toc a::before{content:counter(tc);flex:none;width:22px;color:var(--muted);
 font-size:12.5px;font-weight:700;padding-top:3px;font-variant-numeric:tabular-nums}

/* the body. One measure, one rhythm, and a rule between sections so the eye
   knows where it is on a page it is scrolling with a thumb. */
.lv section{padding:30px 0 0;scroll-margin-top:62px}
.lv section + section{border-top:1px solid var(--line);margin-top:30px}
.lv section > h2{font-size:13px;font-weight:800;letter-spacing:.09em;
 text-transform:uppercase;color:var(--accent);margin:0 0 14px;
 display:flex;gap:11px;align-items:baseline}
.lv section > h2 .no{flex:none;color:var(--muted);font-variant-numeric:tabular-nums}
.lv .bd{font-family:Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif;
 font-size:18.5px;line-height:1.66}
.lv .bd p{margin:0 0 16px}
.lv .bd p:last-child{margin-bottom:0}
.lv .bd strong{font-weight:700}
/* the first line of a section, set apart, the way a manual opens a chapter */
.lv section > .bd > p:first-child{font-size:19.5px;line-height:1.55}

.lv ul.pwen li{font-family:Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif;
 font-size:18px;line-height:1.6;margin-bottom:13px}
.lv blockquote{font-family:Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif;
 font-size:21px}
.lv .atansyon{margin-top:18px}
.lv .atansyon p{font-family:Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif;
 font-size:17px;line-height:1.55}
.lv .vid{margin-top:4px}
.lv .kap{margin-top:-4px}

/* the gate, at the end of the document, exactly as it ends the deck */
.lv .fen{border-top:3px solid var(--ink);margin-top:38px;padding-top:26px;text-align:center}
.lv .fen h2{display:block;font-size:24px;letter-spacing:-.015em;text-transform:none;
 color:var(--ink);font-weight:700;margin-bottom:12px}
.lv .fen .bd{font-size:18px}

.lv .tools{display:flex;gap:10px;margin:26px 0 0;flex-wrap:wrap}
.lv .tools a,.lv .tools button{display:inline-block;padding:10px 16px;
 border:1px solid var(--line);border-radius:var(--r);text-decoration:none;
 color:var(--ink);font-weight:700;font-size:14px;background:var(--card);
 font-family:inherit;cursor:pointer}
.lv .tools a:hover,.lv .tools button:hover{border-color:var(--ink)}

.lv .vid2{margin:0 0 18px}

/* An empty reading version is a real state, not a bug: the deck ships first
   and the manual text follows. Say which, and hand back the deck. */
.lv .poko{border:1px dashed var(--line);border-radius:var(--r);background:var(--card);
 padding:34px 24px;text-align:center;color:var(--muted);margin-top:26px}

@media print{
  .lvtop,.lv .tools,.lv .toc,.draft,.lv .vid,.lv .vid2{display:none}
  body.liv{background:#fff}
  .lv{max-width:none;padding:0}
  .lv section{break-inside:auto;padding-top:22px}
  .lv section > h2{break-after:avoid}
  .lv .atansyon,.lv blockquote{break-inside:avoid}
  .lv h1{font-size:26pt}
  .lv .bd{font-size:11.5pt;line-height:1.5}
  .lv ul.pwen li{font-size:11.5pt}
  a[href]::after{content:""}
}

/* ---------------------------------------------------------- script mode
   ?mod=eskript lays the whole deck out vertically at reading size, for the
   person standing in front of the camera. It is the same deck, not a second
   document -- the thing that gets filmed and the thing the trainee opens can
   never drift, because they are one row in one table. */
body.eskript{display:block;padding:0 0 80px}
body.eskript nav,body.eskript .bar,body.eskript header{display:none}
body.eskript main{overflow:visible}
.sk{max-width:760px;margin:0 auto;padding:24px 22px}
.sk h1{font-size:27px;margin:0 0 4px;letter-spacing:-.02em}
.sk .meta{color:var(--muted);font-size:14px;margin:0 0 4px}
.sk .card{border:1px solid var(--line);border-radius:var(--r);background:var(--card);
 padding:20px 22px;margin:0 0 16px}
.sk .card > .no{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
 color:var(--muted);margin:0 0 10px;display:flex;gap:10px;align-items:baseline}
.sk .card > .no b{color:var(--accent)}
.sk .say{font-size:21px;line-height:1.5}
.sk .say h2{font-size:23px;margin:0 0 12px}
.sk .say ul.pwen li{font-size:20px}
.sk .kam{margin:14px 0 0;padding:11px 14px;border-left:4px solid var(--ok);
 background:#f1f7f2;border-radius:0 var(--r) var(--r) 0;font-size:15px;color:#1b4a2c}
.sk .kam b{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
 margin-bottom:3px}
.sk .tools{display:flex;gap:10px;margin:0 0 20px;flex-wrap:wrap}
.sk .tools a{display:inline-block;padding:10px 16px;border:1px solid var(--ink);
 border-radius:var(--r);text-decoration:none;color:var(--ink);font-weight:700;font-size:15px}
.sk .tools a.pri{background:var(--ink);color:var(--paper)}
@media print{
  .sk .tools,.draft{display:none}
  .sk .card{break-inside:avoid;border-color:#bbb}
  .sk .kam{break-inside:avoid}
  body{background:#fff}
}
</style>
</head>
<body>

<div id="app" hidden>
  <header><span class="t" id="tit"></span>
    <a class="rd" id="rd" href="#" hidden>Li</a>
    <span class="n" id="num"></span></header>
  <div class="bar"><span id="prog"></span></div>
  <div id="draft" class="draft" hidden>BOUYON ... leson sa a poko pare pou piblik la</div>
  <main id="main"></main>
  <nav>
    <button id="prev" type="button">← Anvan</button>
    <span class="mid" id="mid"></span>
    <button id="next" type="button" class="pri">Apre →</button>
  </nav>
</div>

<div id="state" class="msg"><h1>N ap chaje leson an…</h1></div>

<script>
(function () {
  "use strict";

  var API = "https://itnmcxemdpauemsnesln.supabase.co/functions/v1/l";
  var FORM = "/f/?s=";

  var qs = new URLSearchParams(location.search);
  var SLUG = (qs.get("s") || "").trim();
  var PREVIEW = qs.get("prevyou") === "1";
  var MOD = (qs.get("mod") || "").trim();
  var SCRIPT = MOD === "eskript";
  var READ = MOD === "liv";

  var app = document.getElementById("app");
  var state = document.getElementById("state");
  var main = document.getElementById("main");
  var prog = document.getElementById("prog");
  var mid = document.getElementById("mid");
  var num = document.getElementById("num");
  var bPrev = document.getElementById("prev");
  var bNext = document.getElementById("next");

  var SLIDES = [];
  var i = 0;

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // Deliberately tiny: bold, and paragraph breaks. Not a markdown engine.
  // A lesson author who needs more structure needs another slide, not more
  // syntax -- that is the whole reason slides exist.
  function rich(s) {
    return esc(s)
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .split(/\n{2,}/).map(function (p) {
        return "<p>" + p.replace(/\n/g, "<br>") + "</p>";
      }).join("");
  }

  // A YouTube id, and nothing that is not one. The builder stores an id, but
  // people paste whole URLs, so accept a URL and keep only the id. Anything
  // else yields "" and the slide says so rather than framing a stranger's page.
  function ytId(v) {
    var s = String(v || "").trim();
    if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
    var m = s.match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/)([A-Za-z0-9_-]{11})/);
    return m ? m[1] : "";
  }

  function slideHtml(s) {
    var t = String(s.type || "teks");

    if (t === "tit") {
      return '<section class="slide tit">' +
        (s.kalite ? '<div class="kal">' + esc(s.kalite) + "</div>" : "") +
        "<h2>" + esc(s.tit) + "</h2>" +
        (s.sou_tit ? '<p class="sou">' + esc(s.sou_tit) + "</p>" : "") +
        "</section>";
    }

    if (t === "pwen") {
      var cls = s.nimewo ? "pwen nimewo" : "pwen";
      var li = (s.pwen || []).map(function (p) { return "<li>" + rich(p).replace(/^<p>|<\/p>$/g, "") + "</li>"; }).join("");
      return '<section class="slide">' +
        (s.tit ? "<h2>" + esc(s.tit) + "</h2>" : "") +
        '<ul class="' + cls + '">' + li + "</ul>" +
        (s.atansyon ? atansyon(s.atansyon) : "") +
        "</section>";
    }

    if (t === "videyo") {
      var id = ytId(s.youtube);
      var body = id
        ? '<div class="vid" data-yt="' + id + '"' + (s.komanse ? ' data-t="' + (parseInt(s.komanse, 10) || 0) + '"' : "") + '>' +
            '<div class="poster">' +
              '<img loading="lazy" alt="" src="https://i.ytimg.com/vi/' + id + '/hqdefault.jpg">' +
              '<div class="play"></div>' +
              '<div class="lbl">Tape pou w gade</div>' +
            "</div></div>"
        : '<div class="atansyon"><div class="h">Videyo</div>' +
            "<p>Videyo sa a poko mete.</p></div>";
      return '<section class="slide">' +
        (s.tit ? "<h2>" + esc(s.tit) + "</h2>" : "") + body +
        (s.ko ? rich(s.ko) : "") + "</section>";
    }

    if (t === "imaj") {
      return '<section class="slide">' +
        (s.tit ? "<h2>" + esc(s.tit) + "</h2>" : "") +
        (s.url ? '<img class="fig" loading="lazy" alt="' + esc(s.alt || "") + '" src="' + esc(s.url) + '">' : "") +
        (s.kap ? '<p class="kap">' + esc(s.kap) + "</p>" : "") +
        "</section>";
    }

    if (t === "sitasyon") {
      return '<section class="slide"><blockquote>' + rich(s.teks) +
        (s.ki_moun ? '<span class="ki">' + esc(s.ki_moun) + "</span>" : "") +
        "</blockquote></section>";
    }

    if (t === "fen") {
      // The join between the two engines. A lesson ends by handing the trainee
      // the gate that unlocks the next one; the slug is all it takes.
      var href = s.fom ? FORM + encodeURIComponent(s.fom) : (s.lyen || "");
      return '<section class="slide fen">' +
        "<h2>" + esc(s.tit || "Ou fini leson an") + "</h2>" +
        (s.ko ? rich(s.ko) : "") +
        (href ? '<a class="go" href="' + esc(href) + '">' + esc(s.bouton || "Kòmanse travay la") + "</a>" : "") +
        "</section>";
    }

    // teks, and the fallback for anything a future builder invents
    return '<section class="slide">' +
      (s.tit ? "<h2>" + esc(s.tit) + "</h2>" : "") +
      (s.ko ? rich(s.ko) : "") +
      (s.atansyon ? atansyon(s.atansyon) : "") +
      "</section>";
  }

  function atansyon(a) {
    var o = typeof a === "string" ? { ko: a } : (a || {});
    return '<div class="atansyon"><div class="h">' + esc(o.tit || "Atansyon") + "</div>" +
      rich(o.ko) + "</div>";
  }

  // ------------------------------------------------------------- reading mode
  // The manual text as a document. Same blocks as the deck, drawn continuously,
  // so there is no second copy of anything and the two cannot drift.
  //
  // A deck answers "teach me this once." A document answers "what was the line
  // about the share" while a parent is sitting in front of you. Two different
  // jobs, and one of them cannot be done by swiping.

  // Words shown to a trainee, so they follow the lesson's language and not the
  // admin's. KR is the default because KR is what goes live.
  var WORD = {
    KR: { slides:"Glise", read:"Li", min:"minit", minS:"", words:"mo", toc:"Sa ki ladan l",
          openDeck:"Louvri kòm glise", print:"Enprime / sere an PDF",
          poko:"Vèsyon pou li a poko ekri. Leson an la an glise." },
    EN: { slides:"Slides", read:"Read", min:"minute", minS:"s", words:"words", toc:"What is in here",
          openDeck:"Open as slides", print:"Print / save PDF",
          poko:"The reading version is not written yet. The lesson is there as slides." },
    FR: { slides:"Diapos", read:"Lire", min:"minute", minS:"s", words:"mots", toc:"Sommaire",
          openDeck:"Ouvrir en diapos", print:"Imprimer / PDF",
          poko:"La version à lire n'est pas encore écrite. La leçon existe en diapos." }
  };
  var W = WORD.KR;

  function livTitled(b) {
    return b.type !== "fen" && b.type !== "tit" && String(b.tit || "").trim();
  }

  // Contents come out of the blocks that carry a heading. Nothing to maintain,
  // and it cannot fall out of step with the document it indexes.
  function livToc(blocks, offset) {
    var items = [];
    blocks.forEach(function (b, n) {
      var t = livTitled(b);
      if (t) items.push('<li><a href="#s' + (n + offset) + '">' + esc(t) + "</a></li>");
    });
    if (items.length < 3) return "";
    return '<details class="toc" open><summary>' + esc(W.toc || "Contents") +
      "</summary><ol>" + items.join("") + "</ol></details>";
  }

  function livBlock(b, n) {
    var t = String(b.type || "teks");

    if (t === "tit") {
      // A cover inside a document is a section break, not a second cover.
      return '<section id="s' + n + '"><h2>' +
        (b.kalite ? '<span class="no">' + esc(b.kalite) + "</span>" : "") +
        esc(b.tit || "") + "</h2>" +
        (b.sou_tit ? '<div class="bd"><p>' + esc(b.sou_tit) + "</p></div>" : "") +
        "</section>";
    }

    if (t === "fen") {
      var href = b.fom ? FORM + encodeURIComponent(b.fom) : (b.lyen || "");
      return '<section id="s' + n + '" class="fen"><h2>' +
        esc(b.tit || "Ou fini leson an") + "</h2>" +
        (b.ko ? '<div class="bd">' + rich(b.ko) + "</div>" : "") +
        (href ? '<a class="go" href="' + esc(href) + '">' +
          esc(b.bouton || "Kòmanse travay la") + "</a>" : "") +
        "</section>";
    }

    // Everything else: the deck's own markup for the body, framed as a section.
    // slideHtml() draws the parts; this only frames them, which is why a block
    // type added to the deck later shows up here with no work.
    var inner = slideHtml(b)
      .replace(/^<section class="slide[^"]*">/, "")
      .replace(/<\/section>$/, "");
    var head = "";
    var ttl = livTitled(b);
    if (ttl) {
      // The heading is drawn by the frame, so take the deck's copy out rather
      // than print it twice.
      inner = inner.replace("<h2>" + esc(ttl) + "</h2>", "");
      head = "<h2>" + esc(ttl) + "</h2>";
    }
    if (t === "teks" || t === "sitasyon") inner = '<div class="bd">' + inner + "</div>";
    if (t === "videyo") inner = '<div class="vid2">' + inner + "</div>";
    return '<section id="s' + n + '">' + head + inner + "</section>";
  }

  function livWords(blocks) {
    var n = 0;
    function count(v) { n += String(v || "").trim().split(/\s+/).filter(Boolean).length; }
    blocks.forEach(function (b) {
      ["tit", "sou_tit", "ko", "teks", "kap"].forEach(function (k) { if (b[k]) count(b[k]); });
      (b.pwen || []).forEach(count);
      if (b.atansyon) count(typeof b.atansyon === "string" ? b.atansyon : b.atansyon.ko);
    });
    return n;
  }

  function drawLiv(d) {
    document.body.classList.add("liv");
    var blocks = (d.liv && d.liv.slides) || [];
    var deckHref = "/l/?s=" + encodeURIComponent(SLUG) + (PREVIEW ? "&prevyou=1" : "");
    var mine = deckHref + "&mod=liv";

    var top = '<div class="lvtop"><div class="in">' +
      '<span class="t">' + esc(d.tit || "") + "</span>" +
      '<span class="sw"><a href="' + deckHref + '">' + esc(W.slides) + "</a>" +
      '<a class="on" href="' + mine + '">' + esc(W.read) + "</a></span>" +
      '</div><div class="lvbar"><span id="lvprog"></span></div></div>';

    var body;
    if (!blocks.length) {
      body = '<div class="poko"><p>' + esc(W.poko) + "</p>" +
        '<div class="tools" style="justify-content:center"><a href="' + deckHref + '">' +
        esc(W.openDeck) + "</a></div></div>";
    } else {
      var words = livWords(blocks);
      var mins = Math.max(1, Math.round(words / 190));
      var cover = blocks[0] && blocks[0].type === "tit" ? blocks[0] : null;
      var rest = cover ? blocks.slice(1) : blocks;
      var offset = cover ? 1 : 0;

      body =
        (cover && cover.kalite ? '<p class="kal">' + esc(cover.kalite) + "</p>" : "") +
        "<h1>" + esc((cover && cover.tit) || d.tit || "") + "</h1>" +
        (cover && cover.sou_tit ? '<p class="dek">' + esc(cover.sou_tit) + "</p>" : "") +
        '<p class="meta"><b>' + mins + "</b>&nbsp;" + esc(W.min) + (mins === 1 ? "" : esc(W.minS)) +
          " <span>&middot;</span> <b>" + words.toLocaleString() + "</b>&nbsp;" + esc(W.words) +
          " <span>&middot;</span> " + esc(d.lang || "") + "</p>" +
        livToc(rest, offset) +
        rest.map(function (b, n) { return livBlock(b, n + offset); }).join("") +
        '<div class="tools"><a href="' + deckHref + '">' + esc(W.openDeck) + "</a>" +
        '<button type="button" id="lvprn">' + esc(W.print) + "</button></div>";
    }

    document.getElementById("state").hidden = true;
    app.hidden = false;
    app.innerHTML = top + '<div class="lv">' + body + "</div>";

    var pr = document.getElementById("lvprn");
    if (pr) pr.onclick = function () { window.print(); };

    // Progress against the scroll, not against a block count: in a document the
    // only honest answer to "how much is left" is how far down you are.
    var bar = document.getElementById("lvprog");
    if (bar) {
      var tick = function () {
        var h = document.documentElement.scrollHeight - window.innerHeight;
        bar.style.width = (h > 0 ? Math.min(100, (window.scrollY / h) * 100) : 100) + "%";
      };
      window.addEventListener("scroll", tick, { passive: true });
      window.addEventListener("resize", tick);
      tick();
    }

    wireVideo();
  }

  // Everything, laid out vertically, at a size you can read from a metre away
  // with a phone on a tripod. Camera notes are visible HERE and nowhere else:
  // the trainee opening the same lesson never sees them.
  function drawScript(d) {
    document.body.classList.add("eskript");
    var mins = Math.max(1, Math.round(SLIDES.length * 0.4));
    var cards = SLIDES.map(function (s, n) {
      var body = slideHtml(s).replace(/^<section class="slide[^"]*">/, "").replace(/<\/section>$/, "");
      // The video slide is where the camera points at itself. Nothing to read.
      if (s.type === "videyo") {
        body = "<h2>" + esc(s.tit || "Video") + "</h2>" +
          "<p><em>This slide holds the finished video. Nothing to say here.</em></p>";
      }
      return '<div class="card"><p class="no"><span>Slide ' + (n + 1) + " of " + SLIDES.length +
        "</span> <b>" + esc(kindName(s.type)) + "</b></p>" +
        '<div class="say">' + body + "</div>" +
        (s.not_kamera
          ? '<div class="kam"><b>To camera</b>' + rich(s.not_kamera) + "</div>"
          : "") + "</div>";
    }).join("");

    var back = "/l/?s=" + encodeURIComponent(SLUG) + (PREVIEW ? "&prevyou=1" : "");
    var hasLiv = !!(d.liv && d.liv.slides && d.liv.slides.length);
    document.getElementById("state").hidden = true;
    app.hidden = false;
    app.innerHTML = '<div class="sk">' +
      "<h1>" + esc(d.tit) + "</h1>" +
      '<p class="meta">Filming script &middot; ' + SLIDES.length + " slides &middot; about " +
      mins + " minute" + (mins === 1 ? "" : "s") + " read aloud &middot; " + esc(d.lang) + "</p>" +
      '<div class="tools"><a class="pri" href="' + back + '">Open as slides</a>' +
      (hasLiv ? '<a href="' + back + '&mod=liv">Open as reading</a>' : "") +
      '<a href="#" id="prn">Print / save PDF</a></div>' +
      cards + "</div>";
    var pr = document.getElementById("prn");
    if (pr) pr.onclick = function (e) { e.preventDefault(); window.print(); };
  }

  function kindName(t) {
    var m = { tit:"Cover", teks:"Text", pwen:"Points", videyo:"Video",
              imaj:"Image", sitasyon:"Quote", fen:"Ending" };
    return m[t] || t;
  }

  function draw() {
    main.innerHTML = slideHtml(SLIDES[i]);
    main.scrollTop = 0;
    var pct = SLIDES.length < 2 ? 100 : (i / (SLIDES.length - 1)) * 100;
    prog.style.width = pct + "%";
    mid.textContent = (i + 1) + " / " + SLIDES.length;
    num.textContent = (i + 1) + " / " + SLIDES.length;
    bPrev.disabled = i === 0;
    bNext.disabled = i === SLIDES.length - 1;
    // Position is remembered per lesson, so closing WhatsApp mid-lesson and
    // coming back does not start over. Wrapped: a private window throws here.
    try { localStorage.setItem("leson:" + SLUG, String(i)); } catch (e) { /* fine */ }
    wireVideo();
  }

  // The player is only built on tap. Before that the slide is a thumbnail,
  // which costs a few KB instead of a few hundred.
  function wireVideo() {
    // The deck has one video on screen at a time; the reading version has all
    // of them on one page. Wire every facade found, and let each build its own
    // player on tap -- the facade is the whole reason three embeds cost a few
    // KB instead of a few hundred on somebody else's phone data.
    var root = document.body.classList.contains("liv") ? app : main;
    Array.prototype.forEach.call(root.querySelectorAll(".vid[data-yt]"), function (v) {
      var poster = v.querySelector(".poster");
      if (!poster) return;
      poster.addEventListener("click", function () {
        var id = v.getAttribute("data-yt");
        var t = v.getAttribute("data-t");
        var fr = document.createElement("iframe");
        fr.setAttribute("allow", "accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen");
        fr.setAttribute("allowfullscreen", "");
        fr.setAttribute("title", "Videyo");
        // nocookie, and no related videos from other channels at the end.
        fr.src = "https://www.youtube-nocookie.com/embed/" + id +
          "?autoplay=1&rel=0&modestbranding=1&playsinline=1" + (t ? "&start=" + t : "");
        v.innerHTML = "";
        v.appendChild(fr);
      }, { once: true });
    });
  }

  function go(d) {
    var n = i + d;
    if (n < 0 || n >= SLIDES.length) return;
    i = n;
    draw();
  }

  bPrev.addEventListener("click", function () { go(-1); });
  bNext.addEventListener("click", function () { go(1); });

  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight" || e.key === "PageDown") go(1);
    else if (e.key === "ArrowLeft" || e.key === "PageUp") go(-1);
  });

  // Swipe. Horizontal only, and only when the gesture is clearly sideways --
  // otherwise a thumb scrolling a long text slide would page the deck.
  var x0 = null, y0 = null;
  main.addEventListener("touchstart", function (e) {
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, { passive: true });
  main.addEventListener("touchend", function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    var dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.7) go(dx < 0 ? 1 : -1);
    x0 = y0 = null;
  }, { passive: true });

  function fail(h, p) {
    state.innerHTML = "<h1>" + esc(h) + "</h1>" + (p ? "<p>" + esc(p) + "</p>" : "");
    state.hidden = false;
    app.hidden = true;
  }

  if (!SLUG) { fail("Ki leson?", "Lyen an pa konplè."); return; }

  fetch(API + "/" + encodeURIComponent(SLUG) + (PREVIEW ? "?prevyou=1" : ""))
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (res) {
      if (!res.ok) { fail("Nou pa jwenn leson an", res.j && res.j.error); return; }
      var d = res.j;
      SLIDES = (d.deck && d.deck.slides) || [];
      var LIV = (d.liv && d.liv.slides) || [];
      if (!SLIDES.length && !LIV.length) {
        fail("Leson an vid", "Pa gen anyen ladan l pou kounye a."); return;
      }

      document.getElementById("tit").textContent = d.tit || "";
      document.title = (d.tit || "Leson") + " — Konkret";
      document.getElementById("draft").hidden = d.eta === "live";
      if (d.lang) document.documentElement.lang = d.lang === "EN" ? "en" : d.lang === "FR" ? "fr" : "ht";
      W = WORD[d.lang] || WORD.KR;

      if (READ) { drawLiv(d); return; }

      // Resume where they stopped, but never past the end if the deck shrank.
      try {
        var was = parseInt(localStorage.getItem("leson:" + SLUG) || "0", 10);
        if (was > 0 && was < SLIDES.length) i = was;
      } catch (e) { /* fine */ }

      if (SCRIPT) { drawScript(d); return; }

      var rd = document.getElementById("rd");
      if (LIV.length) {
        rd.hidden = false;
        rd.textContent = W.read;
        rd.href = "/l/?s=" + encodeURIComponent(SLUG) + (PREVIEW ? "&prevyou=1" : "") + "&mod=liv";
      }

      state.hidden = true;
      app.hidden = false;
      draw();
    })
    .catch(function () {
      fail("Koneksyon an pa mache", "Tanpri eseye ankò lè entènèt la tounen.");
    });
})();
</script>
</body>
</html>
