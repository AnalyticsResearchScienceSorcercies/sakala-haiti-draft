<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="refresh" content="1; url=/ekip/manyel/#send-0-kondisyon-kr">
<title>Kondisyon yo</title>
<!-- Retired 2026-10-02: the Send 0 quiz form is closed (its 11 August
     responses are kept) and the terms live in the Manyèl, whose kiz asks the
     same five questions. Old links and QR codes land on the terms. The old
     page installed a service worker for offline use; it is removed here so a
     phone cannot keep serving the retired quiz from its cache. -->
<script>
(function () {
  function go() { location.replace("/ekip/manyel/" + location.search + "#send-0-kondisyon-kr"); }
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        return Promise.all(rs.filter(function (r) { return r.scope.indexOf("/send0/") >= 0; })
                             .map(function (r) { return r.unregister(); }));
      }).then(go, go);
      return;
    }
  } catch (e) {}
  go();
})();
</script>
</head>
<body><p><a href="/ekip/manyel/#send-0-kondisyon-kr">Kondisyon yo kounye a nan Manyèl la. Klike la a.</a></p></body>
</html>
