<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Òganizatè TapTap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Òganizatè TapTap, 2026-10-02. Dan's "Fich planifikasyon Dosmond" as five
   homework pages, drawn like the workbook it came from: teal header rows,
   grey section rows, a yellow devwa box, PPP blue and X green. The only
   change from the sheet is the day columns: one week at a time, because 31
   columns do not fit a phone. Everything saves on the phone as it is typed
   and works with no signal; each page sends a copy to Ekip (form
   oganizate-devwa). No account: trainees sharing a phone pick their name. */
:root{
  --ink:#1F2A30; --teal:#1F4E5A; --sand:#FFF4CC; --gold:#9A6A00; --mist:#E3ECEF;
  --grid:#C9D3D6; --muted:#5A6A70; --ppp:#CFE2F3; --x:#D9EAD3; --red:#B3261E; --bg:#FFFFFF;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.35 Arial,Helvetica,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
nav.tabs{position:sticky;top:0;z-index:5;background:#F1F3F4;border-bottom:1px solid #ccc;padding:6px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;border:1px solid #ccc;background:#fff;padding:6px 11px;text-decoration:none;font-size:13px;color:var(--ink);white-space:nowrap}
nav.tabs a.on{background:var(--teal);color:#fff;border-color:var(--teal)}
nav.tabs a .ok{color:#2e7d32;font-weight:700}
nav.tabs a.on .ok{color:#b9f6ca}
.app{max-width:760px;margin:0 auto;padding:10px 10px 60px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h1{color:var(--teal);font-size:19px;margin:6px 0 6px}
.tag{font-size:11px;font-style:italic;color:var(--gold);white-space:nowrap}
.who{font-size:12px;color:var(--muted);margin:0 0 8px}
.link{background:none;border:0;color:var(--teal);text-decoration:underline;cursor:pointer;padding:0 2px;font-size:12px}
.devwa{background:var(--sand);padding:9px 11px;margin:4px 0 12px;font-size:14px}
.devwa b{display:block;font-size:13px;margin-bottom:2px}
table{border-collapse:collapse;width:100%}
td,th{border:1px solid var(--grid);padding:4px 6px;vertical-align:top}
table.hd{margin-bottom:10px}
table.hd th{width:42%;text-align:left;font-weight:700;border:0;padding:3px 6px 3px 0;vertical-align:middle}
table.hd td{padding:0}
table.hd input,table.hd select,table.hd .val{width:100%;border:0;padding:6px 7px;background:transparent;min-height:30px;display:block}
table.hd .val{font-weight:700}
table.g thead th{background:var(--teal);color:#fff;font-weight:700;text-align:center;font-size:12px;padding:5px 2px;line-height:1.15}
table.g thead th.nm{text-align:left;padding-left:6px}
table.g thead th small{display:block;font-weight:400;opacity:.85;font-size:11px}
table.g tr.sec td{background:var(--mist);color:var(--teal);font-weight:700}
table.g td.nm{width:auto}
table.g td.nm input,table.g td.nm textarea{width:100%;border:0;padding:2px 0;background:transparent;resize:none;display:block}
table.g td.nm textarea{font-size:13px;line-height:1.25;overflow:hidden}
table.g td.nm .sub{font-size:11px;color:var(--muted)}
table.g td.nm input.mini{font-size:11px;color:var(--muted)}
table.jou td.x{min-width:0;vertical-align:middle;text-align:center}
table.g td.c{padding:0;width:8%;height:1px}
table.g td.c button{display:block;width:100%;height:100%;min-height:36px;border:0;background:#fff;cursor:pointer;font-size:11px;font-weight:700;padding:0}
table.g td.c button.P{background:var(--ppp)}
table.g td.c button.X{background:var(--x)}
table.g td.c button.T{background:var(--x);font-size:10px}
table.g td.c button:disabled{background:#f6f6f4;cursor:default}
table.g td.c.today{box-shadow:inset 0 0 0 2px #e8a3a0}
table.g tr.det td{background:#FBFAF6}
table.g tr.add td{border-style:dashed}
.addb{background:none;border:0;color:var(--teal);font-weight:700;cursor:pointer;padding:3px 0;font-size:13px}
.del{background:none;border:0;color:var(--red);cursor:pointer;font-size:12px;padding:2px}
.det .f{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.det label{display:block;font-size:11px;color:var(--muted)}
.det label input,.det label select{display:block;width:100%;border:1px solid var(--grid);padding:5px 6px;margin-top:2px;background:#fff;color:var(--ink);font-size:13px}
.det .full{grid-column:1 / -1}
.wk{display:flex;align-items:center;justify-content:space-between;margin:6px 0 4px}
.wk button{border:1px solid #ccc;background:#fff;width:40px;height:30px;cursor:pointer;font-size:16px;color:var(--teal)}
.wk button:disabled{opacity:.35;cursor:default}
.wk b{font-size:13px}
.legend{font-size:12px;color:var(--muted);margin:2px 0 6px}
.legend i{display:inline-block;width:12px;height:12px;vertical-align:-2px;margin:0 3px 0 8px;border:1px solid var(--grid)}
.scroll{overflow-x:auto}
table.jou td{padding:0;min-width:90px}
table.jou td input,table.jou td textarea{width:100%;border:0;padding:6px;background:transparent;min-height:34px;resize:vertical}
table.jou th{background:var(--teal);color:#fff;font-size:12px;padding:5px}
table.jou tr.tot td{border:0;padding:6px;font-weight:700}
table.ex td{font-size:13px}
table.ex tr.sec td{background:var(--mist);color:var(--teal);font-weight:700}
table.ex thead th{background:var(--teal);color:#fff;text-align:left;padding:5px 6px;font-size:12px}
table.lis th{background:var(--teal);color:#fff;text-align:left;font-size:12px;padding:5px 6px}
table.lis td a{color:var(--ink)}
.send{margin-top:16px;border:2px solid var(--teal);padding:10px}
.send p{margin:6px 0 0;font-size:13px}
.go{background:var(--teal);color:#fff;border:0;padding:10px 14px;font-weight:700;cursor:pointer;width:100%;font-size:14px}
.go.sec{background:#fff;color:var(--teal);border:1px solid var(--teal)}
.ok{color:#2e7d32;font-weight:700}
.wait{color:var(--gold);font-weight:700}
.err{color:var(--red)}
.people button{display:block;width:100%;text-align:left;padding:10px;margin-bottom:6px;background:#fff;border:1px solid var(--grid);font-weight:700;cursor:pointer}
p{margin:6px 0}
</style>

// ------------------------------------------------------------ helpers
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function pad(n){ return ("0"+n).slice(-2); }
function today(){ var d = new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function thisMonth(){ return today().slice(0,7); }
function num(v){ var n = Number(String(v||"").replace(/[^0-9.\-]/g,"")); return isFinite(n) ? n : 0; }
function fmt(n){ return Math.round(n).toLocaleString("fr-FR"); }

}

// ------------------------------------------------------------ weeks
// A "week" is Monday to Sunday. Week 1 is the one holding the 1st of the
// month; days that belong to the next or previous month are greyed out.
function weeksOf(ym){
  var y = +ym.slice(0,4), m = +ym.slice(5,7) - 1;
  var first = new Date(y, m, 1), last = new Date(y, m+1, 0).getDate();
  var start = new Date(first); start.setDate(1 - (first.getDay()+6)%7);
  var out = [];
  for(var w = 0; w < 6; w++){
    var days = [];
    for(var i = 0; i < 7; i++){
      var d = new Date(start); d.setDate(start.getDate() + w*7 + i);
      days.push(d.getMonth() === m ? d.getDate() : 0);
    }
    if(days.some(function(x){ return x; })){ out.push(days); }
  }
  return out;
}
var WEEK = null;
function curWeek(){
  var ws = weeksOf(M().mwa);
  if(WEEK === null){
    WEEK = 0;
    if(M().mwa === thisMonth()){
      var td = new Date().getDate();
      ws.forEach(function(w, i){ if(w.indexOf(td) >= 0){ WEEK = i; } });
    }
  }
  if(WEEK >= ws.length){ WEEK = ws.length - 1; }
  return {ws:ws, i:WEEK, days:ws[WEEK]};
}
var DH = ["L","M","M","J","V","S","D"];
var MN = ["janvye","fevriye","mas","avril","me","jen","jiyè","out","septanm","oktòb","novanm","desanm"];
function mwaTx(){ return MN[+M().mwa.slice(5,7)-1] + " " + M().mwa.slice(0,4); }
function weekBar(){
  var c = curWeek(), real = c.days.filter(function(x){ return x; });
  return '<div class="wk"><button data-wk="-1" aria-label="Semèn anvan"'+(c.i===0?" disabled":"")+'>‹</button>'
    + '<b>Semèn '+(c.i+1)+' · '+real[0]+' – '+real[real.length-1]+' '+MN[+M().mwa.slice(5,7)-1]+'</b>'
    + '<button data-wk="1" aria-label="Semèn apre"'+(c.i===c.ws.length-1?" disabled":"")+'>›</button></div>';
}
// The teal header row: the name column, then this week's seven days.
function gridHead(first){
  var c = curWeek(), h = '<thead><tr><th class="nm">'+esc(first)+'</th>';
  c.days.forEach(function(day, i){ h += '<th>'+DH[i]+'<small>'+(day||"")+'</small></th>'; });
  return h + '</tr></thead>';
}
// mode: "pp" = blank, PPP, X   "x" = blank, X   "t" = blank, the hour now
function dayCells(path, d, mode){
  var c = curWeek(), td = (M().mwa === thisMonth()) ? new Date().getDate() : 0, h = "";
  c.days.forEach(function(day){
    if(!day){ h += '<td class="c"><button disabled></button></td>'; return; }
    var v = d[day] || "", cls = v === "P" ? "P" : v === "X" ? "X" : v ? "T" : "";
    var txt = v === "P" ? "PPP" : v || "";
    h += '<td class="c'+(day===td?" today":"")+'"><button class="'+cls+'" data-cell="'+path+'" data-day="'+day+'" data-mode="'+mode+'" aria-label="'+day+'">'+esc(txt)+'</button></td>';
  });
  return h;
}
function legend(mode){
  if(mode === "x"){ return '<p class="legend">Tape sou yon jou lè aksyon an fèt:<i style="background:var(--x)"></i>X fèt</p>'; }
  if(mode === "t"){ return '<p class="legend">Tape sou jou a lè aksyon an fèt: lè a ekri poukont li (egzanp 6è). Tape ankò pou efase.</p>'; }

// ------------------------------------------------------------ path get/set
function getP(path){ return path.split(".").reduce(function(o,k){ return o == null ? o : o[k]; }, M()); }
function setP(path, v){
  var ks = path.split("."), o = M();
  for(var i = 0; i < ks.length-1; i++){ o = o[ks[i]]; if(o == null){ return; } }
  o[ks[ks.length-1]] = v;
}
function rowById(list, id){ for(var i=0;i<list.length;i++){ if(list[i].id === id){ return i; } } return -1; }
// A header row in the sheet's own shape: bold label left, boxed value right.
function hrow(label, path, type, extra){
  var v = getP(path); if(v == null){ v = ""; }
  return '<tr><th>'+label+'</th><td><input data-f="'+path+'" type="'+(type||"text")+'" value="'+esc(v)+'"'+(extra||"")+'></td></tr>';
}
function hval(label, val){ return '<tr><th>'+label+'</th><td><span class="val">'+esc(val)+'</span></td></tr>'; }
function dfld(label, path, type, cls, extra){
  var v = getP(path); if(v == null){ v = ""; }
  return '<label class="'+(cls||"")+'">'+label+'<input data-f="'+path+'" type="'+(type||"text")+'" value="'+esc(v)+'"'+(extra||"")+'></label>';

function sendBox(n){

  if(v && v.ref){ st = '<p class="ok">✓ Rive nan Ekip · Referans '+esc(v.ref)+' · '+esc(v.dat)+'</p><p>Ou ka voye l ankò si ou chanje l.</p>'; }

  return '<div class="send"><button class="go" data-send="'+n+'">Voye devwa '+n+' bay Ekip</button><div id="st'+n+'">'+st+'</div></div>';
}
function snapshot(n){
  var m = M(), data, lines = [];
  if(n === 1){
    data = m.plan;
    lines.push("Patnè: "+(data.patne||"—")+" · Lokalite: "+(data.lokalite||"—")+" · Kontra: "+(data.kontra||"—")+" · Mwa: "+m.mwa);
    data.tach.forEach(function(t){
      var dd = Object.keys(t.d).filter(function(k){ return t.d[k]; }).map(function(k){ return k+t.d[k]; }).join(" ");
      if(t.resp || t.bidje || t.depans || t.nivo !== "poko" || t.kom || dd){
        lines.push("- "+t.t+" | "+(t.resp||"?")+" | "+({poko:"poko",apfet:"ap fèt",fini:"fini"}[t.nivo])+(t.bidje?" | $"+t.bidje:"")+(dd?" | "+dd:"")+(t.kom?" | "+t.kom:""));
      }
    });
  } else if(n === 2){
    data = m.kal;
    data.rows.forEach(function(r){ if(r.t.trim()){ lines.push("- ["+r.sek+"] "+r.t+" · "+(r.k||"?")+" · "+Object.keys(r.d).filter(function(k){ return r.d[k]; }).map(function(k){ return k+r.d[k]; }).join(" ")); } });
  } else if(n === 3){
    data = m.mgr;
    data.rows.forEach(function(r){ if(r.t.trim()){ lines.push("- "+r.t+" | "+(r.resp||"?")+" | jou fèt: "+Object.keys(r.d).filter(function(k){ return r.d[k]; }).join(",")); } });
  } else if(n === 4){
    data = {kont:m.kont, aksyon:m.kal.rows.filter(function(r){ return r.t.trim(); }).map(function(r){ return {id:r.id, t:r.t}; })};
    lines.push("Kontraktyèl: "+(m.kont.non||"—")+" · Sipèvize: "+(m.kont.sipevize||"—"));
    data.aksyon.forEach(function(a){ var d = m.kont.d[a.id] || {}; var ks = Object.keys(d).filter(function(k){ return d[k]; });
      if(ks.length){ lines.push("- "+a.t+": "+ks.map(function(k){ return k+"("+d[k]+")"; }).join(" ")); } });
  } else {
    data = m.jou;
    data.forEach(function(j){ lines.push("- "+(j.dat||"?")+" · "+(j.pct||"?")+"% · "+(j.chif||"")+" · "+(j.kob||0)+" goud"); });
  }
  var json = JSON.stringify(data), out = {rezime: lines.join("\n").slice(0, 3900)};
  for(var i = 0; i < CHUNKS; i++){ out["done_"+(i+1)] = json.slice(i*CHUNK, (i+1)*CHUNK); }
  out.too_big = json.length > CHUNK*CHUNKS;
  return out;
}
function qread(){ try { return JSON.parse(localStorage.getItem(KQ) || "[]"); } catch(e){ return []; } }
function qwrite(a){ try { localStorage.setItem(KQ, JSON.stringify(a)); } catch(e){} }
var FLY = false;
function flush(){
  if(FLY || !window.fetch){ return; }
  var a = qread(); if(!a.length){ return; }
  var item = a[0]; FLY = true;
  fetch(VOYE, {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(item.p)})
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, s:r.status, j:j}; }); })
    .then(function(x){
      FLY = false;
      if(x.ok && x.j && x.j.ok){
        qwrite(qread().filter(function(o){ return o.id !== item.id; }));
        var who = DB.moun[item.non];
        if(who){ who.voye[item.n] = {ref: x.j.referans || "ok", dat: today()}; save(true); }
        render(); flush();
      } else if(x.s >= 400 && x.s < 500){
        // A refusal will not fix itself on retry. Drop it and say so.
        qwrite(qread().filter(function(o){ return o.id !== item.id; }));
        var w2 = DB.moun[item.non]; if(w2){ delete w2.voye[item.n]; save(true); }
        var el = document.getElementById("st"+item.n);
        if(el){ el.innerHTML = '<p style="color:var(--red)">Ekip pa t aksepte l: '+esc((x.j && x.j.error) || "erè")+'</p>'; }
      }
    })
    .catch(function(){ FLY = false; });
}
function send(n){
  var m = M(), s = snapshot(n), p = PAJ.filter(function(x){ return x.n === n; })[0];
  if(s.too_big){ alertBox(n, "Paj sa a twò gwo pou voye. Retire kèk liy vid epi eseye ankò."); return; }
  var payload = {non:m.non, tel:m.tel || "", devwa:n, paj:p.t, mwa:m.mwa, vesyon:VESYON, kle:m.kle};
  for(var k in s){ if(k !== "too_big"){ payload[k] = s[k]; } }
  var a = qread().filter(function(o){ return !(o.non === m.non && o.n === n); });
  a.push({id:uid(), non:m.non, n:n, p:payload}); qwrite(a);
  m.voye[n] = {pending:true}; save(true); render(); flush();
}
function alertBox(n, msg){ var el = document.getElementById("st"+n); if(el){ el.innerHTML = '<p style="color:var(--red)">'+esc(msg)+'</p>'; } }

// Only the few figures that depend on what was typed are refreshed.
main.addEventListener("input", function(e){

});

  var t = e.target, path = t.getAttribute && t.getAttribute("data-f");

});
main.addEventListener("click", function(e){
  var t = e.target.closest ? e.target.closest("button,[data-act]") : null;
  if(!t){ return; }
  var m = M();
  if(t.hasAttribute("data-cell")){
    var d = getP(t.getAttribute("data-cell")) || {}, day = t.getAttribute("data-day"), mode = t.getAttribute("data-mode"), v = d[day] || "";
    if(mode === "pp"){ d[day] = v === "" ? "P" : v === "P" ? "X" : ""; }
    else if(mode === "x"){ d[day] = v ? "" : "X"; }
    else { d[day] = v ? "" : new Date().getHours()+"è"; }
    if(!d[day]){ delete d[day]; }
    setP(t.getAttribute("data-cell"), d); save(true); render(); return;
  }
  if(t.hasAttribute("data-wk")){ WEEK = Math.max(0, (WEEK||0) + (+t.getAttribute("data-wk"))); render(); return; }
  if(t.hasAttribute("data-open")){ var id = t.getAttribute("data-open"); OPEN[id] = !OPEN[id]; render(); return; }
  if(t.hasAttribute("data-del")){
    var list = getP(t.getAttribute("data-del")), i = rowById(list, t.getAttribute("data-id"));
    if(i >= 0){ list.splice(i, 1); save(true); render(); }
    return;
  }
  if(t.hasAttribute("data-add")){
    var a = t.getAttribute("data-add"), sek = t.getAttribute("data-sek");
    if(a === "plan"){ var nt = {id:uid(), faz:sek, t:"", resp:"", bidje:"", depans:"", nivo:"poko", kom:"", pita:"", d:{}}; insertAfterLast(m.plan.tach, "faz", sek, nt); OPEN[nt.id] = true; }
    if(a === "kal"){ insertAfterLast(m.kal.rows, "sek", sek, {id:uid(), sek:sek, t:"", k:"", d:{}}); }
    if(a === "mgr"){ insertAfterLast(m.mgr.rows, "sek", sek, {id:uid(), sek:sek, t:"", resp:"", d:{}}); }
    if(a === "jou"){ m.jou.push({id:uid(), dat:today(), pct:"", chif:"", kob:"", detay:"", lot:""}); }
    save(true); render(); return;
  }
  if(t.hasAttribute("data-send")){ send(+t.getAttribute("data-send")); return; }
  var act = t.getAttribute("data-act");
  if(act === "chanje"){ DB.aktif = ""; save(true); pickPerson(); return; }
  if(act === "nouvo-mwa"){
    m.mwa = thisMonth(); WEEK = null;
    m.plan.tach.forEach(function(x){ x.d = {}; x.nivo = "poko"; x.depans = ""; });
    m.kal.rows.forEach(function(x){ x.d = {}; }); m.mgr.rows.forEach(function(x){ x.d = {}; });
    m.kont.d = {}; m.jou = []; m.voye = {};
    save(true); location.hash = "#0"; render();
  }
});
main.addEventListener("click", function(e){
  var b = e.target.closest ? e.target.closest("[data-moun]") : null;
  if(b){ DB.aktif = b.getAttribute("data-moun"); WEEK = null; save(true); location.hash = "#0"; route(); }
});
function insertAfterLast(list, key, val, item){
  var at = -1; list.forEach(function(x, i){ if(x[key] === val){ at = i; } });
  list.splice(at < 0 ? list.length : at + 1, 0, item);
}

load();
window.addEventListener("hashchange", route);
window.addEventListener("online", flush);
route();
flush();
})();
</script>
