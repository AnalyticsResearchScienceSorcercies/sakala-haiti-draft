<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Konkret — Fòm</title>
<style>
/* ============================================================
   THE FORM STYLE. Written once, inherited by every form ever
   created. Nobody using the builder touches CSS, so nobody can
   make an ugly form. Change it here, every form changes.
   ============================================================ */
:root{
  --ink:#12100e; --paper:#fbf9f5; --line:#d9d2c6; --card:#fff;
  --accent:#8a1c1c; --ok:#1f6f3d; --warn:#7a5610; --muted:#6b645c;
  --r:8px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
 font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 padding:20px 16px 64px}
.wrap{max-width:640px;margin:0 auto}

header{border-bottom:3px solid var(--ink);padding-bottom:12px;margin-bottom:24px}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px;margin:0}

fieldset{border:1px solid var(--line);border-radius:var(--r);background:var(--card);
 padding:16px;margin:0 0 18px}
legend{font-weight:700;font-size:15px;padding:0 8px}
.hint{color:var(--muted);font-size:13px;margin:-4px 0 12px}

label.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;
 border:1px solid var(--line);border-radius:6px;margin-bottom:7px;cursor:pointer;
 background:var(--card)}
label.opt:has(input:checked){border-color:var(--ink);background:#f3efe7;font-weight:600}
input[type=radio],input[type=checkbox]{margin-top:4px;flex:none;
 width:18px;height:18px;accent-color:var(--ink)}

label.fld{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
.req{color:var(--accent)}
.fldwrap{margin-bottom:14px}
.fldwrap:last-child{margin-bottom:0}
input[type=text],input[type=tel],input[type=number],input[type=date],
input[type=time],input[type=email],select,textarea{
 width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:6px;
 font-size:16px;font-family:inherit;background:var(--card);color:var(--ink)}
textarea{resize:vertical;min-height:80px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
 background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;
 background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:38px}

button.go{width:100%;padding:15px;background:var(--ink);color:var(--paper);border:0;
 border-radius:var(--r);font-size:17px;font-weight:700;cursor:pointer;font-family:inherit}
button.go:active{transform:translateY(1px)}
button.go[disabled]{opacity:.55;cursor:progress}

.hp{position:absolute;left:-9999px}
.note{border-radius:6px;padding:12px;margin:0 0 16px;font-size:14px;font-weight:600}
.note.err{background:#fdecec;border:1px solid var(--accent);color:var(--accent)}
.note.warn{background:#fff6e0;border:1px solid var(--warn);color:var(--warn)}

/* signature: a box you draw in with a finger */
.sigwrap{border:1px solid var(--line);border-radius:6px;background:var(--card);overflow:hidden}
.sigwrap.drawn{border-color:var(--ink)}
canvas.sig{display:block;width:100%;height:150px;touch-action:none;cursor:crosshair}
.sigbar{display:flex;align-items:center;gap:10px;padding:7px 10px;border-top:1px solid var(--line);
 background:var(--paper)}
.sigbar .lbl{flex:1;font-size:12px;color:var(--muted)}
.sigbar button{background:0;border:1px solid var(--line);border-radius:5px;padding:5px 12px;
 font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}

/* rating: tap a number */
.rate{display:flex;gap:7px;flex-wrap:wrap}
.rate button{flex:1 1 auto;min-width:46px;padding:12px 6px;border:1px solid var(--line);
 border-radius:6px;background:var(--card);color:var(--ink);font:inherit;font-weight:700;
 font-size:17px;cursor:pointer}
.rate button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.rateends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px}

/* currency: unit sits inside the box */
.cur{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:6px;overflow:hidden;
 background:var(--card)}
.cur .unit{display:flex;align-items:center;padding:0 12px;background:var(--paper);
 border-right:1px solid var(--line);font-weight:700;font-size:14px;color:var(--muted)}
.cur input{border:0;border-radius:0}
.cur input.kalkil{background:#F1EFE8;font-weight:700;color:#111}
/* repeatable rows: a card per row. A six-column table on a 360px phone is a
   form nobody finishes, so each row is its own card with its own number and
   its own remove button, and the columns stack. */
.grp{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);
 padding:10px 10px 4px;margin-top:2px}
.grow{background:var(--card);border:1px solid var(--line);border-radius:6px;
 padding:12px;margin-bottom:10px}
.growhead{display:flex;align-items:center;gap:10px;margin:0 0 11px}
.growhead .n{flex:1;font-weight:700;font-size:12px;letter-spacing:.05em;
 text-transform:uppercase;color:var(--muted)}
.growhead .amt{font-weight:700;font-size:14px;white-space:nowrap}
.growhead button{background:0;border:1px solid var(--line);border-radius:5px;
 padding:5px 11px;font:inherit;font-size:13px;font-weight:600;color:var(--accent);
 cursor:pointer}
.growhead button[disabled]{opacity:.4;cursor:not-allowed;color:var(--muted)}
.grow .fldwrap{margin-bottom:10px}
.grow .fldwrap:last-child{margin-bottom:0}
.gradd{width:100%;padding:12px;margin-bottom:10px;background:var(--card);
 border:1px dashed var(--line);border-radius:6px;font:inherit;font-size:15px;
 font-weight:700;color:var(--ink);cursor:pointer}
.gradd[disabled]{opacity:.5;cursor:not-allowed;font-weight:600;color:var(--muted)}

/* a computed number is not a box you type in, and it should not look like one */
input[readonly]{background:var(--paper);color:var(--muted);font-weight:700}
.cur input[readonly]{background:var(--paper)}

/* file: pick a photo or a PDF, upload it before the form is sent */
.up{border:1px solid var(--line);border-radius:6px;background:var(--card);padding:10px}
.up.on{border-color:var(--ink)}
.up.bad{border-color:var(--accent)}
.up input[type=file]{position:absolute;left:-9999px}
.upbtn{width:100%;padding:14px 12px;background:var(--paper);border:1px dashed var(--line);
 border-radius:6px;font:inherit;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer}
.upbtn:active{transform:translateY(1px)}
.uprow{display:flex;gap:10px;align-items:center}
.upthumb{width:52px;height:52px;flex:none;border:1px solid var(--line);border-radius:5px;
 object-fit:cover;background:var(--paper);display:flex;align-items:center;justify-content:center;
 font-size:11px;font-weight:700;color:var(--muted)}
.upmeta{flex:1;min-width:0;font-size:13px;color:var(--muted)}
.upmeta .nm{display:block;color:var(--ink);font-weight:600;overflow:hidden;
 text-overflow:ellipsis;white-space:nowrap}
.upbar{height:6px;background:#e6dfd2;border-radius:3px;overflow:hidden;margin-top:6px}
.upbar span{display:block;height:100%;width:0;background:var(--ink);transition:width .2s}
.up .x{flex:none;background:0;border:1px solid var(--line);border-radius:5px;padding:6px 11px;
 font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
.uperr{color:var(--accent);font-size:13px;font-weight:600;margin:0}

.res{text-align:center;padding:36px 20px;background:var(--card);
 border:1px solid var(--line);border-radius:10px}
.big{font-size:52px;font-weight:800;margin:0 0 4px;letter-spacing:-.02em}
.pass{color:var(--ok)}.fail{color:var(--accent)}
.msg{font-size:17px;margin:10px 0 0}
.manke{text-align:left;margin:6px 0 0;padding-left:20px;font-size:15px;line-height:1.5}
.manke li{margin:4px 0}
.again{display:inline-block;margin-top:22px;color:var(--ink);font-size:15px}
.center{text-align:center;color:var(--muted);padding:50px 20px}
[hidden]{display:none!important}


/* ============================================================
   QUIZ MODE. One question a screen, marked the moment it is
   answered. Turned on by `kiz: true` on the schema; every form
   without it renders exactly as it did before.
   ============================================================ */
.lang{display:flex;gap:6px}
.lang button{background:var(--card);border:1px solid var(--line);border-radius:999px;
 padding:5px 13px;font:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.lang button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.htop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}

.kount{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
 color:var(--muted);margin:0 0 6px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:0 0 20px}
.bar span{display:block;height:100%;background:var(--ink);transition:width .25s}
.kes{font-size:19px;font-weight:700;line-height:1.35;margin:0 0 16px;letter-spacing:-.01em}

button.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
 padding:13px 14px;border:1px solid var(--line);border-radius:8px;margin-bottom:9px;
 background:var(--card);color:var(--ink);font:inherit;font-size:16px;line-height:1.4;cursor:pointer}
button.opt:active{transform:translateY(1px)}
button.opt .tik{flex:none;width:20px;height:20px;border:2px solid var(--line);border-radius:50%;
 margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
button.opt.many .tik{border-radius:5px}
button.opt.on{border-color:var(--ink);background:#f3efe7;font-weight:600}
button.opt.on .tik{border-color:var(--ink);background:var(--ink);color:var(--paper)}
button.opt[disabled]{cursor:default;opacity:.72}
button.opt.on[disabled]{opacity:1}

.jij{border-radius:8px;padding:14px;margin:16px 0 0;border:1px solid var(--line);background:var(--card)}
.jij .v{font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin:0 0 7px}
.jij p{margin:0;font-size:15.5px;line-height:1.55}
.jij.bon{border-color:var(--ok)} .jij.bon .v{color:var(--ok)}
.jij.mwatye{border-color:var(--warn)} .jij.mwatye .v{color:var(--warn)}
.jij.pa{border-color:var(--accent)} .jij.pa .v{color:var(--accent)}

/* the card: sized and styled to be screenshotted into WhatsApp */
.kat{border:2px solid var(--ink);border-radius:12px;padding:26px 20px;background:var(--card);
 text-align:center;margin:0 0 18px}
.kat .kt{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
 color:var(--muted);margin:0 0 12px}
.kat .ks{font-size:60px;font-weight:800;line-height:1;letter-spacing:-.03em;margin:0}
.kat .kd{font-size:14px;color:var(--muted);margin:10px 0 0}
.kat .kdom{font-size:13px;font-weight:700;letter-spacing:.06em;margin:16px 0 0;
 padding-top:14px;border-top:1px solid var(--line)}
.mini{font-size:13px;color:var(--muted);text-align:center;margin:14px 0 0}
button.alt{width:100%;padding:13px;background:var(--card);color:var(--ink);
 border:1px solid var(--line);border-radius:var(--r);font:inherit;font-size:15px;
 font-weight:600;cursor:pointer;margin-top:10px}

@media(prefers-color-scheme:dark){
 :root{--ink:#f2ede4;--paper:#16140f;--line:#3d3830;--card:#1f1c16;--muted:#a49b8e;--warn:#e8c877}
 label.opt:has(input:checked){background:#2b271f}
 button.opt.on{background:#2b271f}
 button.alt{background:#1f1c16}
 button.go{background:#f2ede4;color:#16140f}
 .note.err{background:#2e1a1a}
 .note.warn{background:#2b2312;border-color:#7a5610}
 .upbtn{background:#16140f}
 .upbar{background:#3d3830}}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="center" id="boot">N ap chaje…</div>
</div>

<script>
(function () {
  var API = "https://itnmcxemdpauemsnesln.supabase.co/functions/v1/f";
  var slug = new URLSearchParams(location.search).get("s") || "";
  var wrap = document.getElementById("wrap");
  var QKEY = "fom_kew_" + slug;
  var DEF = null;
  var UPLOADING = 0;   // files still on the wire; submit waits for zero

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c];
    });
  }
  function attr(o, k) { return o[k] ? " " + k + '="' + esc(o[k]) + '"' : ""; }

  // ---------- queue: localStorage survives the tab being closed ----------
  function qread(){ try { return JSON.parse(localStorage.getItem(QKEY)||"[]"); } catch(e){ return []; } }
  function qwrite(a){ try { localStorage.setItem(QKEY, JSON.stringify(a)); return true; } catch(e){ return false; } }
  function qpush(p){ var a=qread(); a.push(p); return qwrite(a); }

  function post(payload) {
    return fetch(API + "/" + encodeURIComponent(slug), {
      method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload)
    }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); });
  }

  // POST /f/<slug>/<sub> — used by the file field to ask for one signed
  // upload URL. Same shape as post(), different path.
  function ask(sub, payload) {
    return fetch(API + "/" + encodeURIComponent(slug) + "/" + sub, {
      method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload)
    }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); });
  }

  function flush() {
    var a = qread();
    if (!a.length) return Promise.resolve();
    return post(a[0]).then(function (o) {
      // 4xx means the server rejected it on the merits; drop it rather than
      // wedge every later response behind one bad row.
      if (o.ok || (o.j && o.j.error)) { qwrite(qread().slice(1)); return flush(); }
    }).catch(function(){ /* still offline */ });
  }

  // ---------------------- field renderers ----------------------
  var FIELD = {
    text:     function(f){ return input(f,"text"); },
    tel:      function(f){ return input(f,"tel"); },
    number:   function(f){ return input(f,"number"); },
    date:     function(f){ return input(f,"date"); },
    time:     function(f){ return input(f,"time"); },
    email:    function(f){ return input(f,"email"); },
    currency: function(f){
      if (Array.isArray(f.product_of) || Array.isArray(f.total_of)) {
        return wrapFld(Object.assign({}, f, { required: false }),
          '<div class="cur"><span class="unit">' + esc(f.currency || "HTG") + "</span>" +
          '<input type="number" name="'+esc(f.key)+'" class="kalkil" readonly tabindex="-1"></div>' +
          '<p class="hint">Kalkile otomatikman.</p>');
      }
      return wrapFld(f, '<div class="cur"><span class="unit">' + esc(f.currency || "HTG") + "</span>" +
        '<input type="number" name="'+esc(f.key)+'"'+(f.required?" required":"") +
        ((f.readonly||f.sum_of)?" readonly":"") +
        ' inputmode="decimal" min=""'+(f.min!=null?esc(f.min):"0")+'" step="'+esc(f.step||"0.01")+'"></div>'); },
    rating:   function(f){
      var lo = f.min == null ? 1 : +f.min, hi = f.max == null ? 5 : +f.max, b = "";
      for (var i = lo; i <= hi; i++) {
        b += '<button type="button" class="rate-b" data-rate="'+esc(f.key)+'" value="'+i+'">'+i+"</button>";
      }
      return wrapFld(f, '<div class="rate" data-ratefor="'+esc(f.key)+'">'+b+"</div>" +
        '<input type="hidden" name="'+esc(f.key)+'"'+(f.required?" required":"")+">" +
        (f.low || f.high
          ? '<div class="rateends"><span>'+esc(f.low||"")+"</span><span>"+esc(f.high||"")+"</span></div>"
          : "")); },
    signature: function(f){
      // Drawn with a finger, stored as a PNG data URL. The anti-shadow-payroll
      // rule in the specs is literally a signature, so this is load-bearing.
      return wrapFld(f, '<div class="sigwrap" data-sigwrap="'+esc(f.key)+'">' +
        '<canvas class="sig" data-sig="'+esc(f.key)+'"></canvas>' +
        '<div class="sigbar"><span class="lbl">Siyen ak dwèt ou nan bwat la</span>' +
        '<button type="button" data-sigclear="'+esc(f.key)+'">Efase</button></div></div>' +
        '<input type="hidden" name="'+esc(f.key)+'"'+(f.required?" required":"")+">"); },
    file:     function(f){
      // The hidden input holds {"path":"..."} once the bytes are in Storage.
      // The bytes never travel with the form; the form only carries a receipt.
      var acc = f.accept === "photo" ? "image/*"
              : f.accept === "pdf"   ? "application/pdf"
              : "image/*,application/pdf";
      var lbl = f.accept === "pdf" ? "Chwazi yon dokiman"
              : f.camera           ? "Pran yon foto"
              : "Chwazi yon foto";
      return wrapFld(f, '<div class="up" data-upwrap="'+esc(f.key)+'">' +
        '<input type="file" data-upin="'+esc(f.key)+'" accept="'+acc+'"'+
          (f.camera ? ' capture="environment"' : "") + ">" +
        '<button type="button" class="upbtn" data-uppick="'+esc(f.key)+'">'+esc(lbl)+"</button>" +
        '<div data-upshow="'+esc(f.key)+'"></div></div>' +
        '<input type="hidden" name="'+esc(f.key)+'"'+(f.required?" required":"")+">"); },
    textarea: function(f){
      return wrapFld(f, '<textarea name="'+esc(f.key)+'"'+(f.required?" required":"")+
        attr(f,"placeholder")+' rows="'+(f.rows||3)+'"></textarea>'); },
    select:   function(f){
      var o = '<option value="">—</option>' + (f.options||[]).map(function(x){
        return '<option value="'+esc(x.v)+'">'+esc(x.t)+"</option>"; }).join("");
      return wrapFld(f, '<select name="'+esc(f.key)+'"'+(f.required?" required":"")+">"+o+"</select>"); },
    radio:    function(f){ return choice(f,"radio"); },
    checkbox: function(f){ return choice(f,"checkbox"); },
    // A group draws its shell here and its rows in wireGroups(), because the
    // rows are the part that changes after the page is built.
    group:    function(f){
      var need = (f.min == null ? 0 : +f.min) > 0;
      return '<div class="fldwrap">' +
        (f.label ? '<label class="fld">' + esc(f.label) +
          (need ? ' <span class="req">*</span>' : "") + "</label>" : "") +
        (f.hint ? '<p class="hint">' + esc(f.hint) + "</p>" : "") +
        '<div class="grp" data-grp="' + esc(f.key) + '"><div class="grows"></div>' +
        '<button type="button" class="gradd" data-gradd="1">+ ' +
          esc(f.add_label || "Ajoute yon liy") + "</button></div></div>";
    }
  };

  function wrapFld(f, control) {
    return '<div class="fldwrap">' +
      (f.label ? '<label class="fld">'+esc(f.label)+(f.required?' <span class="req">*</span>':"")+"</label>" : "") +
      control + "</div>";
  }
  function input(f, type) {
    return wrapFld(f, '<input type="'+type+'" name="'+esc(f.key)+'"'+
      (f.required?" required":"") + ((f.readonly||f.sum_of)?" readonly":"") +
      attr(f,"placeholder") + attr(f,"autocomplete") +
      (f.min!=null?' min="'+esc(f.min)+'"':"") + (f.max!=null?' max="'+esc(f.max)+'"':"") +
      (f.step!=null?' step="'+esc(f.step)+'"':"") +
      (type==="tel"?' inputmode="tel"':"") + ">");
  }
  // The question goes through wrapFld like every other field. It did not until
  // 2026-10-02, so every radio and checkbox drew its options with no question
  // above them: a column of "Wi / Non" nobody could answer on purpose.
  function choice(f, type) {
    return wrapFld(f, (f.options||[]).map(function (x, i) {
      return '<label class="opt"><input type="'+type+'" name="'+esc(f.key)+'" value="'+esc(x.v)+'"'+
        (f.required && type==="radio" && i===0 ? " required":"") + "><span>"+esc(x.t)+"</span></label>";
    }).join(""));
  }

  // ==========================================================
  // QUIZ MODE
  //
  // Three things the plain renderer cannot do, all asked for by
  // one observation: a score that arrives after the last question
  // teaches nothing, because by then nobody is still thinking
  // about question two.
  //
  //   1. One question a screen, marked the moment it is answered,
  //      with the explanation where the attention already is.
  //   2. A language toggle, so one row serves a manager in Kreyol
  //      and a partner in French. Display only - the value stored
  //      and scored is always the Kreyol option value, so
  //      ekip_repons never goes bilingual.
  //   3. A result card built to be screenshotted into WhatsApp.
  //
  // Turned on by `kiz: true`. Every other form renders as before.
  // ==========================================================
  var L = "kr", STEP = 0, ANS = {}, QS = [], INTRO = [];
  try { var sv = localStorage.getItem("fom_lang"); if (sv === "fr" || sv === "kr") L = sv; } catch (e) {}

  var MWA = {
    kr: ["janvye","fevriye","mas","avril","me","jen","jiye","out","septanm","oktob","novanm","desanm"],
    fr: ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"]
  };
  function dat() { var d = new Date(); return d.getDate() + " " + MWA[L][d.getMonth()] + " " + d.getFullYear(); }
  function w(kr, frTxt) { return L === "fr" ? frTxt : kr; }

  // The French overlay is ONE object at the root of the schema, keyed by
  // section index and field key - never tucked beside the Kreyol on the
  // option objects themselves. The builder's option editor rebuilds every
  // option as {v,t} from a textarea, so anything stored on an option is wiped
  // the first time somebody edits the wording. Out here it cannot be reached.
  function frAll() { return (DEF && DEF.schema && DEF.schema.fr) || null; }
  function bilingual() { var f = frAll(); return !!(f && f.fields); }
  function frNow() { return L === "fr" ? frAll() : null; }
  function topTx(k, d) { var f = frNow(); return (f && f[k]) || d; }
  function secTx(sec, i) { var f = frNow(), o = f && f.sections && f.sections[String(i)];
    return (o && o.legend) || sec.legend || ""; }
  function fldTx(fl, k, d) { var f = frNow(), o = f && f.fields && f.fields[fl.key];
    return (o && o[k]) || d; }
  function optTx(fl, o) { var f = frNow(), x = f && f.fields && f.fields[fl.key];
    return (x && x.options && x.options[o.v]) || o.t; }

  // A copy with the visible strings swapped, so the existing field renderers
  // draw French without knowing French exists. The KEY and the option VALUES
  // are untouched, which is what keeps the submission monolingual.
  function locFld(fl) {
    if (!frNow()) return fl;
    var c = {}; for (var k in fl) c[k] = fl[k];
    c.label = fldTx(fl, "label", fl.label);
    if (fl.options) c.options = fl.options.map(function (o) { return { v: o.v, t: optTx(fl, o) }; });
    return c;
  }

  // A section is a question if it holds a scored field. `kesyon` is set by
  // strip() in the API, standing in for the answer key it deletes.
  function buildKiz() {
    QS = []; INTRO = [];
    (DEF.schema.sections || []).forEach(function (sec, i) {
      var q = (sec.fields || []).filter(function (f) { return f.kesyon; })[0];
      if (q) QS.push({ sec: sec, i: i, f: q }); else INTRO.push({ sec: sec, i: i });
    });
  }

  function kizShell() {
    var s = DEF.schema;
    var lang = bilingual()
      ? '<div class="lang"><button type="button" data-lang="kr" class="' + (L === "kr" ? "on" : "") + '">Kreyòl</button>' +
        '<button type="button" data-lang="fr" class="' + (L === "fr" ? "on" : "") + '">Français</button></div>'
      : "";
    wrap.innerHTML = '<header><div class="htop"><div><h1>' + esc(topTx("tit", DEF.tit)) + "</h1>" +
      (s.subtitle ? '<p class="sub">' + esc(topTx("subtitle", s.subtitle)) + "</p>" : "") +
      "</div>" + lang + "</div></header>" +
      '<div id="note" hidden></div><div id="stage"></div>';
    Array.prototype.forEach.call(wrap.querySelectorAll("[data-lang]"), function (b) {
      b.onclick = function () {
        L = b.getAttribute("data-lang");
        try { localStorage.setItem("fom_lang", L); } catch (e) {}
        kizShell(); drawStep();
      };
    });
    if (DEF.eta === "bouyon") note("warn", "BOUYON — fòm sa a poko louvri. Repons yo p ap anrejistre.");
  }

  function drawStep() {
    var st = document.getElementById("stage");
    if (STEP === 0) return drawIntro(st);
    if (STEP <= QS.length) return drawQ(st, STEP - 1);
    return drawSend(st);
  }

  function drawIntro(st) {
    var body = INTRO.map(function (x) {
      var inner = (x.sec.fields || []).map(function (fl) {
        var r = FIELD[fl.type];
        return r ? r(locFld(fl)) : '<div class="note err">Kalite chan «' + esc(fl.type) + '» pa rekonèt.</div>';
      }).join("");
      return "<fieldset>" + (x.sec.legend ? "<legend>" + esc(secTx(x.sec, x.i)) + "</legend>" : "") +
        (x.sec.hint ? '<p class="hint">' + esc(x.sec.hint) + "</p>" : "") + inner + "</fieldset>";
    }).join("");

    st.innerHTML = '<form id="f"><input class="hp" name="website" tabindex="-1" autocomplete="off">' +
      body + '<button class="go" type="submit">' + esc(w("Kòmanse", "Commencer")) + "</button></form>";

    // A real submit, so the browser's own required-field checking still runs
    // on the identity block. Nothing is sent here; it only advances a step.
    document.getElementById("f").addEventListener("submit", function (e) {
      e.preventDefault();
      var fd = new FormData(document.getElementById("f"));
      INTRO.forEach(function (x) {
        (x.sec.fields || []).forEach(function (fl) {
          ANS[fl.key] = fl.type === "checkbox" ? fd.getAll(fl.key)
                      : fl.type === "file"     ? filePick(fd.get(fl.key))
                      : (fd.get(fl.key) || "");
        });
      });
      ANS.website = fd.get("website") || "";
      STEP = 1; drawStep(); window.scrollTo(0, 0);
    });
    wireRatings(); wireSignatures(); wireFiles(); showQueue();
  }

  function drawQ(st, qi) {
    var q = QS[qi], fl = q.f, many = fl.type === "checkbox";
    var sel = [], locked = false;

    st.innerHTML =
      '<p class="kount">' + esc(w("Kesyon", "Question")) + " " + (qi + 1) + " / " + QS.length + "</p>" +
      '<div class="bar"><span style="width:' + Math.round(qi / QS.length * 100) + '%"></span></div>' +
      '<p class="kes">' + esc(secTx(q.sec, q.i)) + "</p>" +
      '<div id="opts">' + (fl.options || []).map(function (o) {
        return '<button type="button" class="opt' + (many ? " many" : "") + '" data-v="' + esc(o.v) + '">' +
          '<span class="tik"></span><span>' + esc(optTx(fl, o)) + "</span></button>";
      }).join("") + "</div>" +
      (many ? '<button class="go" id="go" type="button">' + esc(w("Tcheke", "Valider")) + "</button>" : "") +
      '<div id="jij"></div>';

    Array.prototype.forEach.call(st.querySelectorAll("button.opt"), function (b) {
      b.onclick = function () {
        if (locked) return;
        var v = b.getAttribute("data-v");
        if (many) {
          var at = sel.indexOf(v);
          if (at >= 0) { sel.splice(at, 1); b.classList.remove("on"); }
          else { sel.push(v); b.classList.add("on"); }
        } else {
          Array.prototype.forEach.call(st.querySelectorAll("button.opt"), function (x) { x.classList.remove("on"); });
          b.classList.add("on");
          sel = [v];
          mark(v);
        }
      };
    });
    var go = document.getElementById("go");
    if (go) go.onclick = function () {
      if (!sel.length) { note("err", w("Chwazi omwen youn.", "Choisissez au moins une réponse.")); return; }
      document.getElementById("note").hidden = true;
      mark(sel.slice());
    };

    // The answer locks once it is marked. Letting somebody change it after
    // reading the explanation would make the stored response a record of the
    // explanation rather than of what they knew.
    function mark(val) {
      if (locked) return;
      locked = true;
      ANS[fl.key] = val;
      Array.prototype.forEach.call(st.querySelectorAll("button.opt"), function (x) { x.disabled = true; });
      if (go) go.hidden = true;
      ask("tcheke", { key: fl.key, val: val })
        .then(function (o) { show(o.ok ? o.j : null); })
        .catch(function () { show(null); });   // offline: no mark, but never a dead end
    }

    function show(j) {
      var nx = qi + 1 < QS.length ? w("Kesyon ki vini an", "Question suivante") : w("Wè rezilta a", "Voir le résultat");
      var panel = "";
      if (j) {
        var pt = Number(j.pwen) || 0;
        var cls = pt >= 1 ? "bon" : pt > 0 ? "mwatye" : "pa";
        var verd = pt >= 1 ? w("Kòrèk", "Correct")
                 : pt > 0  ? w("An pati", "En partie")
                           : w("Se pa sa", "Pas celle-là");
        var tex = (L === "fr" && j.eksplikasyon_fr) ? j.eksplikasyon_fr : (j.eksplikasyon || "");
        panel = '<div class="jij ' + cls + '"><p class="v">' + esc(verd) + "</p>" +
          (tex ? "<p>" + esc(tex) + "</p>" : "") + "</div>";
      }
      document.getElementById("jij").innerHTML = panel +
        '<button class="go" id="nx" type="button" style="margin-top:16px">' + esc(nx) + "</button>";
      document.getElementById("nx").onclick = function () { STEP++; drawStep(); window.scrollTo(0, 0); };
    }
  }

  function drawSend(st) {
    st.innerHTML = '<div class="center">' + esc(w("N ap voye…", "Envoi…")) + "</div>";
    var payload = {}; for (var k in ANS) payload[k] = ANS[k];
    if (navigator.onLine === false) {
      if (qpush(payload)) return kizBanked(st);
    }
    post(payload).then(function (o) {
      if (!o.ok) { st.innerHTML = '<div class="note err">' + esc(o.j.error || "Gen yon pwoblèm.") + "</div>"; return; }
      kizDone(st, o.j);
    }).catch(function () {
      if (qpush(payload)) kizBanked(st);
      else st.innerHTML = '<div class="note err">' + esc(w("Koneksyon an pa mache.", "Pas de connexion.")) + "</div>";
    });
  }

  function katHtml(sko, sub) {
    return '<div class="kat"><p class="kt">' + esc(topTx("tit", DEF.tit)) + "</p>" +
      '<p class="ks">' + esc(sko) + '</p><p class="kd">' + esc(sub) + "</p>" +
      '<p class="kdom">konkret-haiti.com</p></div>';
  }

  // `manke` comes back from the API as the question's own legend, and the API
  // has one language. On a French page that put a Kreyol list under a French
  // heading. The overlay already holds both, so map one to the other here
  // rather than teaching the server about languages.
  function frLegend() {
    var f = frNow();
    if (!f || !f.sections) return null;
    var map = {};
    (DEF.schema.sections || []).forEach(function (sec, i) {
      var o = f.sections[String(i)];
      if (o && o.legend && sec.legend) map[sec.legend] = o.legend;
    });
    return map;
  }

  function kizDone(st, o) {
    var sko = o.esko == null ? "✓" : o.esko + "%";
    var miss = "";
    if (o.manke && o.manke.length) {
      var tr = frLegend();
      miss = '<p class="msg" style="text-align:left">' + esc(w("Gade kesyon sa yo ankò:", "Revoyez ces questions :")) +
        '</p><ul class="manke">' + o.manke.map(function (m) {
          return "<li>" + esc((tr && tr[m]) || m) + "</li>";
        }).join("") + "</ul>";
    }
    var f = frAll();
    var msg = (L === "fr" && f && f.success_message) ? f.success_message : o.msg;
    st.innerHTML = katHtml(sko, QS.length + " " + w("kesyon", "questions") + " · " + dat()) +
      '<p class="msg">' + esc(msg) + "</p>" + miss +
      '<p class="mini">' + esc(w("Pran yon foto ekran pou w kenbe kat sa a.",
                                 "Faites une capture d’écran pour garder cette carte.")) + "</p>" +
      (navigator.share ? '<button class="alt" id="pataje" type="button">' + esc(w("Pataje", "Partager")) + "</button>" : "") +
      '<button class="alt" id="ankor" type="button">' + esc(w("Reponn ankò", "Recommencer")) + "</button>";
    var sh = document.getElementById("pataje");
    if (sh) sh.onclick = function () {
      navigator.share({ title: DEF.tit, text: DEF.tit + " — " + sko + " · konkret-haiti.com" }).catch(function () {});
    };
    document.getElementById("ankor").onclick = function () { location.reload(); };
    window.scrollTo(0, 0);
  }

  function kizBanked(st) {
    st.innerHTML = katHtml("✓", dat()) +
      '<p class="msg">' + esc(w("Repons ou sove sou telefòn nan. N ap voye l otomatikman lè intènèt la tounen.",
                                "Vos réponses sont enregistrées sur le téléphone. Elles partiront au retour du réseau.")) + "</p>" +
      '<button class="alt" id="ankor" type="button">' + esc(w("Reponn ankò", "Recommencer")) + "</button>";
    document.getElementById("ankor").onclick = function () { location.reload(); };
    window.scrollTo(0, 0);
  }

  // ---------------------- repeatable row groups ----------------------
  // NAMING. Every input inside a row is called
  //     "g." + groupKey + "." + rowUid + "." + columnKey
  // Two properties carry weight. The dots make a row input's name impossible
  // to confuse with a top-level field key, which must match
  // ^[a-z][a-z0-9_]{0,40}$ and so can never contain one — which in turn means
  // the stray row names sitting in FormData can never be picked up by
  // collect(), and a row's radio buttons can never join the group next door.
  // And the uid is a counter that is never reused, so deleting row 2 does not
  // renumber rows 3 and 4 and nothing anywhere holds a stale index.

  var GUID = 0;

  function gname(gk, uid, ck) { return "g." + gk + "." + uid + "." + ck; }

  function groupFields() {
    var out = [];
    ((DEF.schema || {}).sections || []).forEach(function (sec) {
      (sec.fields || []).forEach(function (f) { if (f.type === "group") out.push(f); });
    });
    return out;
  }

  // Every declared total, resolved once: which field holds it, which group and
  // column feed it.
  function sumTargets() {
    var out = [];
    ((DEF.schema || {}).sections || []).forEach(function (sec) {
      (sec.fields || []).forEach(function (f) {
        if (typeof f.sum_of !== "string") return;
        var i = f.sum_of.indexOf(".");
        if (i <= 0 || i === f.sum_of.length - 1) return;
        out.push({ key: f.key, gk: f.sum_of.slice(0, i), ck: f.sum_of.slice(i + 1) });
      });
    });
    return out;
  }

  function round2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }
  function money(n) {
    return (Math.round(n * 100) / 100)
      .toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function addRow(f) {
    var box = document.querySelector('[data-grp="' + f.key + '"] .grows');
    if (!box) return false;
    var max = f.max == null ? 20 : +f.max;
    if (box.children.length >= max) return false;

    var uid = ++GUID;
    var cells = (f.fields || []).map(function (c) {
      var d = {}, k;
      for (k in c) if (Object.prototype.hasOwnProperty.call(c, k)) d[k] = c[k];
      d.key = gname(f.key, uid, c.key);
      // Requiredness inside a row is checked in missingRequired(), never by the
      // browser. A row the person added and left alone is dropped on collect,
      // so a native `required` on it would wedge the submit button against a
      // row that is not going to be sent at all.
      d.required = false;
      if (c.product_of) d.readonly = true;
      var r = FIELD[c.type];
      return r ? r(d)
        : '<div class="note err">Kalite kolòn «' + esc(c.type) + '» pa rekonèt.</div>';
    }).join("");

    var div = document.createElement("div");
    div.className = "grow";
    div.setAttribute("data-grow", uid);
    div.innerHTML = '<div class="growhead"><span class="n"></span><span class="amt"></span>' +
      '<button type="button" data-grdel="1">Retire</button></div>' + cells;
    box.appendChild(div);
    renumber(f);
    recalc();
    return true;
  }

  function renumber(f) {
    var box = document.querySelector('[data-grp="' + f.key + '"]');
    if (!box) return;
    var rows = box.querySelectorAll("[data-grow]");
    var word = f.row_label || "Liy";
    var max = f.max == null ? 20 : +f.max;
    Array.prototype.forEach.call(rows, function (row, i) {
      row.querySelector(".growhead .n").textContent = word + " " + (i + 1);
      row.querySelector("[data-grdel]").disabled = rows.length <= 1;
    });
    var add = box.querySelector("[data-gradd]");
    add.disabled = rows.length >= max;
    add.textContent = rows.length >= max
      ? "Ou rive nan maksimòm " + max + " " + word.toLowerCase()
      : "+ " + (f.add_label || "Ajoute yon liy");
  }

  // Reads one group out of the DOM in display order, flagging rows nobody has
  // touched. The required check needs the number printed on the card, not the
  // index in the array it is about to send.
  function groupRows(f) {
    var out = [];
    var rows = document.querySelectorAll('[data-grp="' + f.key + '"] [data-grow]');
    Array.prototype.forEach.call(rows, function (row, i) {
      var uid = row.getAttribute("data-grow"), obj = {}, blank = true;
      (f.fields || []).forEach(function (c) {
        var n = gname(f.key, uid, c.key);
        var el = c.type === "radio"
          ? row.querySelector('[name="' + n + '"]:checked')
          : row.querySelector('[name="' + n + '"]');
        var v = el ? el.value : "";
        obj[c.key] = v;
        if (String(v).trim() !== "") blank = false;
      });
      out.push({ n: i + 1, v: obj, blank: blank });
    });
    return out;
  }

  function collectGroup(f) {
    return groupRows(f)
      .filter(function (r) { return !r.blank; })
      .map(function (r) { return r.v; });
  }

  // Live arithmetic, and cosmetic on purpose. The `f` function recomputes every
  // product and every total from the stored rows and overwrites whatever
  // arrives. This exists so the person watches the number move while they type,
  // which is the entire reason the total stops being a guess.
  function recalc() {
    var targets = sumTargets();

    groupFields().forEach(function (f) {
      var rows = document.querySelectorAll('[data-grp="' + f.key + '"] [data-grow]');
      var chip = null, t;
      for (t = 0; t < targets.length; t++) {
        if (targets[t].gk === f.key) { chip = targets[t].ck; break; }
      }
      Array.prototype.forEach.call(rows, function (row) {
        var uid = row.getAttribute("data-grow");
        (f.fields || []).forEach(function (c) {
          if (!c.product_of || c.product_of.length < 2) return;
          var p = 1, ok = true, i, el, x;
          for (i = 0; i < c.product_of.length; i++) {
            el = row.querySelector('[name="' + gname(f.key, uid, c.product_of[i]) + '"]');
            x = el && el.value !== "" ? Number(el.value) : NaN;
            if (!isFinite(x)) { ok = false; break; }
            p *= x;
          }
          var out = row.querySelector('[name="' + gname(f.key, uid, c.key) + '"]');
          if (out) out.value = ok ? round2(p) : "";
        });
        var amt = row.querySelector(".growhead .amt");
        if (amt) {
          var cel = chip ? row.querySelector('[name="' + gname(f.key, uid, chip) + '"]') : null;
          amt.textContent = cel && cel.value !== "" && isFinite(Number(cel.value))
            ? money(Number(cel.value)) : "";
        }
      });
    });

    // Totals accumulate in centimes: 1200.10 + 1200.20 has to be 2400.30 and
    // not 2400.2999999999997 on a money form.
    targets.forEach(function (t) {
      var cents = 0;
      var rows = document.querySelectorAll('[data-grp="' + t.gk + '"] [data-grow]');
      Array.prototype.forEach.call(rows, function (row) {
        var el = row.querySelector(
          '[name="' + gname(t.gk, row.getAttribute("data-grow"), t.ck) + '"]');
        var x = el && el.value !== "" ? Number(el.value) : NaN;
        if (isFinite(x)) cents += Math.round(x * 100);
      });
      var dst = document.querySelector('[name="' + t.key + '"]');
      if (dst) dst.value = cents / 100;
    });
  }

  function wireGroups() {
    groupFields().forEach(function (f) {
      var box = document.querySelector('[data-grp="' + f.key + '"]');
      if (!box) return;

      // Delegated on the container, so a row added in ten minutes needs no
      // wiring of its own and nothing has to be rebound after a remove.
      box.addEventListener("click", function (e) {
        var t = e.target;
        if (!t || !t.getAttribute) return;
        if (t.getAttribute("data-gradd") !== null) { addRow(f); return; }
        if (t.getAttribute("data-grdel") === null) return;
        var row = t.parentNode && t.parentNode.parentNode;
        if (row && row.getAttribute && row.getAttribute("data-grow") !== null) {
          row.parentNode.removeChild(row);
          renumber(f);
          recalc();
        }
      });
      box.addEventListener("input", recalc);
      box.addEventListener("change", recalc);

      // Always open with at least one row. An empty table reads as a broken
      // page; a blank row reads as an invitation, and collect() drops it if
      // nobody writes in it.
      var start = Math.max(1, f.min == null ? 1 : +f.min);
      for (var i = 0; i < start; i++) addRow(f);
    });
    recalc();
  }

  // ---------------------- page renderers ----------------------
  function renderForm(d) {
    var s = d.schema || {};
    var body = (s.sections||[]).map(function (sec, si) {
      var inner = (sec.fields||[]).map(function (f) {
        var r = FIELD[f.type];
        var h = r ? r(f) : '<div class="note err">Kalite chan «'+esc(f.type)+'» pa rekonèt.</div>';
        return f.si ? '<div data-si-f="' + esc(f.key) + '">' + h + "</div>" : h;
      }).join("");
      return "<fieldset" + (sec.si ? ' data-si-s="' + si + '"' : "") + ">" +
        (sec.legend?"<legend>"+esc(sec.legend)+"</legend>":"") +
        (sec.hint?'<p class="hint">'+esc(sec.hint)+"</p>":"") + inner + "</fieldset>";
    }).join("");

    wrap.innerHTML =
      "<header><h1>"+esc(d.tit)+"</h1>" +
      (s.subtitle?'<p class="sub">'+esc(s.subtitle)+"</p>":"") + "</header>" +
      '<div id="note" hidden></div>' +
      '<form id="f"><input class="hp" name="website" tabindex="-1" autocomplete="off">' +
      body + '<button class="go" id="btn" type="submit">'+esc(s.submit_label||"Voye")+"</button></form>" +
      '<div id="res" class="res" hidden></div>';

    document.getElementById("f").addEventListener("submit", submit);
    wireRatings();
    wireSignatures();
    wireFiles();
    wireGroups();
    showQueue();
    wireAuto();
    wireSi();
  }

  // ---------------- show only if, 2026-10-02 ----------------
  // si: {chan: "prezans", vo: ["prezan"]} on a field or a whole section. The
  // question shows only while that answer is picked; hidden, it is neither
  // required nor kept. The `f` function applies the same rule and blanks a
  // hidden answer, so a value typed before the person changed their mind
  // (hours on a youth then marked absent) never reaches the record.
  function siVals(k) {
    var els = document.querySelectorAll('#f [name="' + k + '"]'), out = [];
    Array.prototype.forEach.call(els, function (e) {
      if (e.type === "radio" || e.type === "checkbox") { if (e.checked) out.push(e.value); }
      else if (e.value !== "") out.push(e.value);
    });
    return out;
  }
  function siOk(c) {
    if (!c || !c.chan) return true;
    var want = [].concat(c.vo == null ? [] : c.vo).map(String), got = siVals(c.chan);
    return got.some(function (v) { return want.indexOf(v) >= 0; });
  }
  function siFor(f, sec) { return f.si || (sec && sec.si) || null; }
  function siApply() {
    (DEF.schema.sections || []).forEach(function (sec, i) {
      var box = sec.si ? document.querySelector('[data-si-s="' + i + '"]') : null;
      if (box) siShow(box, siOk(sec.si));
      (sec.fields || []).forEach(function (f) {
        var el = f.si ? document.querySelector('[data-si-f="' + f.key + '"]') : null;
        if (el) siShow(el, siOk(f.si));
      });
    });
  }
  // Hidden inputs must also drop their native `required`, or the browser
  // would refuse to submit over a question the person cannot see.
  function siShow(el, on) {
    el.hidden = !on;
    Array.prototype.forEach.call(el.querySelectorAll("input,select,textarea"), function (x) {
      if (!on && x.required) { x.setAttribute("data-si-req", "1"); x.required = false; }
      if (on && x.getAttribute("data-si-req")) { x.required = true; x.removeAttribute("data-si-req"); }
    });
  }
  function wireSi() {
    var form = document.getElementById("f");
    if (!form) return;
    form.addEventListener("change", siApply);
    form.addEventListener("input", siApply);
    siApply();
  }

  // ------------------- auto numbers, 2026-10-02 -------------------
  // Field properties, all optional. Only product_of and total_of reach the server, which
  // recomputes it and overwrites whatever the phone sent:
  //   product_of: ["key", 130]  a figure = those fields x those constants, live
  //   total_of: ["a", "b", "-c"] a figure = a + b - c, blanks counting as 0
  //   sonje: "group"            remembered on this phone, filled in next time
  //   semen: true               (with sonje) a week number that moves itself on:
  //                             the last one saved + the whole weeks since
  //   jou: "lendi"|"vandredi"|"jodi"  a date that starts on this week's
  //                             Monday or Friday, or on today
  //   pa_semen: "key"           a select picked from a week number, using each
  //                             option's semen: [from, to]
  // Everything filled in stays editable. A guess the person can see and fix
  // beats a blank they have to work out.
  var SK = "fom_sonje";
  function allFields() {
    var a = [];
    (DEF.schema.sections || []).forEach(function (sec) {
      (sec.fields || []).forEach(function (f) { a.push(f); });
    });
    return a;
  }
  function byName(k) { return document.querySelector('#f [name="' + k + '"]'); }
  function lendiDe(d) {
    var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() - (x.getDay() + 6) % 7);
    return x;
  }
  function isoDay(d) {
    return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
  }
  function sread() { try { return JSON.parse(localStorage.getItem(SK) || "{}"); } catch (e) { return {}; } }
  function swrite(o) { try { localStorage.setItem(SK, JSON.stringify(o)); } catch (e) {} }

  function wireAuto() {
    var F = allFields(), mem = sread(), lendi = lendiDe(new Date());
    // A link can choose for the person: /f/?s=devwa-modil&modil=4 opens the
    // homework form on Modil 4. Only fields the form declares, never `s`, and
    // only select, radio and plain text, so a link cannot sign or upload.
    var qp = new URLSearchParams(location.search);
    F.forEach(function (f) {
      if (f.key === "s" || !qp.has(f.key)) return;
      var v = qp.get(f.key);
      if (f.type === "radio") {
        var r = document.querySelector('#f input[name="' + f.key + '"][value="' + v.replace(/"/g, "") + '"]');
        if (r) r.checked = true;
      } else if (f.type === "select" || f.type === "text" || f.type === "number") {
        var e = byName(f.key);
        if (e && !e.value) e.value = v;
      }
    });
    F.forEach(function (f) {
      var e = byName(f.key);
      if (!e || e.value) return;
      if (f.jou === "lendi" || f.jou === "vandredi" || f.jou === "jodi") {
        var d = f.jou === "jodi" ? new Date() : new Date(lendi);
        if (f.jou === "vandredi") d.setDate(d.getDate() + 4);
        e.value = isoDay(d);
      }
      // le: "kounye" -- a time that starts on the minute the form was opened.
      if (f.le === "kounye") {
        var n = new Date();
        e.value = ("0" + n.getHours()).slice(-2) + ":" + ("0" + n.getMinutes()).slice(-2);
      }
      var m = f.sonje ? (mem[f.sonje] || {})[f.key] : null;
      if (m && m.v != null && m.v !== "") {
        if (f.semen) {
          var p = String(m.t || "").split("-");
          var then = p.length === 3 ? new Date(+p[0], +p[1] - 1, +p[2]) : lendi;
          e.value = Number(m.v) + Math.max(0, Math.round((lendi - then) / 6048e5));
        } else {
          e.value = m.v;
        }
      }
    });
    F.forEach(function (f) {
      if (!f.pa_semen) return;
      var src = byName(f.pa_semen), dst = byName(f.key);
      if (!src || !dst) return;
      function pick() {
        var n = Number(src.value);
        if (!n) return;
        (f.options || []).forEach(function (o) {
          if (o.semen && n >= o.semen[0] && n <= o.semen[1]) dst.value = o.v;
        });
      }
      src.addEventListener("input", pick);
      pick();
    });
    // Products first, then signed totals, because a total can add up a
    // product (net pay = hours x 130 + refunds - savings). One pass on every
    // keystroke anywhere in the form: a computed field changes without an
    // input event of its own, so per-field listeners would miss the chain.
    function num(k) {
      var e = byName(k);
      return !e || e.value === "" ? null : Number(e.value);
    }
    function autoCalc() {
      F.forEach(function (f) {
        if (!Array.isArray(f.product_of)) return;
        var out = byName(f.key);
        if (!out) return;
        var p = 1, ok = true;
        f.product_of.forEach(function (k) {
          var n = typeof k === "number" ? k : num(k);
          if (n === null || !isFinite(n)) ok = false; else p *= n;
        });
        out.value = ok ? Math.round(p * 100) / 100 : "";
      });
      F.forEach(function (f) {
        if (!Array.isArray(f.total_of)) return;
        var out = byName(f.key);
        if (!out) return;
        var cents = 0, any = false;
        f.total_of.forEach(function (t) {
          t = String(t);
          var neg = t.charAt(0) === "-", n = num(neg ? t.slice(1) : t);
          if (n === null || !isFinite(n)) return;
          any = true;
          cents += (neg ? -1 : 1) * Math.round(n * 100);
        });
        out.value = any ? cents / 100 : "";
      });
      // nan_le: {soti, rive, minit, dat} on a yes/no radio -- "filed within the
      // hour?" answered from the two times the person already typed. It counts
      // as late when the incident date is not today. Still editable.
      F.forEach(function (f) {
        var c = f.nan_le;
        if (!c) return;
        var a = byName(c.soti), b = byName(c.rive), dk = c.dat ? byName(c.dat) : null;
        if (!a || !b || !a.value || !b.value) return;
        var m = function (v) { var p = v.split(":"); return (+p[0]) * 60 + (+p[1]); };
        var mins = m(b.value) - m(a.value);
        var jodi = !dk || !dk.value || dk.value === isoDay(new Date());
        var ok = jodi && mins >= 0 && mins <= (c.minit || 60);
        var r = document.querySelector('#f input[name="' + f.key + '"][value="' + (ok ? (c.wi || "wi") : (c.non || "non")) + '"]');
        if (r) r.checked = true;
      });
    }
    var form = document.getElementById("f");
    if (form) form.addEventListener("input", autoCalc);
    autoCalc();
  }

  // Saved only once a response is sent or safely queued, so a form someone
  // abandoned halfway never becomes next week's default.
  function sonjeSave(payload) {
    var mem = sread(), t = isoDay(lendiDe(new Date())), any = false;
    allFields().forEach(function (f) {
      var v = payload[f.key];
      if (!f.sonje || v == null || v === "") return;
      mem[f.sonje] = mem[f.sonje] || {};
      mem[f.sonje][f.key] = { v: v, t: t };
      any = true;
    });
    if (any) swrite(mem);
  }

  function wireRatings() {
    Array.prototype.forEach.call(document.querySelectorAll("[data-rate]"), function (b) {
      b.onclick = function () {
        var key = b.getAttribute("data-rate");
        var box = document.querySelector('[data-ratefor="' + key + '"]');
        Array.prototype.forEach.call(box.querySelectorAll("button"), function (x) {
          x.classList.remove("on");
        });
        b.classList.add("on");
        document.querySelector('input[name="' + key + '"]').value = b.value;
      };
    });
  }

  function wireSignatures() {
    Array.prototype.forEach.call(document.querySelectorAll("[data-sig]"), function (cv) {
      var key = cv.getAttribute("data-sig");
      var hidden = document.querySelector('input[name="' + key + '"]');
      var wrap = document.querySelector('[data-sigwrap="' + key + '"]');
      var ctx, drawing = false, dirty = false;

      // Match the backing store to the CSS size so strokes are not blurry
      // and land under the finger on a high-DPI phone.
      function size() {
        var r = cv.getBoundingClientRect();
        var dpr = window.devicePixelRatio || 1;
        var data = dirty ? cv.toDataURL() : null;
        cv.width = Math.max(1, Math.round(r.width * dpr));
        cv.height = Math.max(1, Math.round(r.height * dpr));
        ctx = cv.getContext("2d");
        ctx.scale(dpr, dpr);
        ctx.lineWidth = 2.2;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = getComputedStyle(cv).color || "#12100e";
        if (data) { var img = new Image(); img.onload = function(){ ctx.drawImage(img,0,0,r.width,r.height); }; img.src = data; }
      }
      size();
      window.addEventListener("resize", size);

      function pt(e) {
        var r = cv.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
      }
      cv.addEventListener("pointerdown", function (e) {
        drawing = true; cv.setPointerCapture(e.pointerId);
        var p = pt(e); ctx.beginPath(); ctx.moveTo(p.x, p.y);
        e.preventDefault();
      });
      cv.addEventListener("pointermove", function (e) {
        if (!drawing) return;
        var p = pt(e); ctx.lineTo(p.x, p.y); ctx.stroke();
        if (!dirty) { dirty = true; wrap.classList.add("drawn"); }
        e.preventDefault();
      });
      function stop() {
        if (!drawing) return;
        drawing = false;
        if (dirty) hidden.value = cv.toDataURL("image/png");
      }
      cv.addEventListener("pointerup", stop);
      cv.addEventListener("pointercancel", stop);
      cv.addEventListener("pointerleave", stop);

      var clear = document.querySelector('[data-sigclear="' + key + '"]');
      if (clear) clear.onclick = function () {
        var r = cv.getBoundingClientRect();
        ctx.clearRect(0, 0, r.width, r.height);
        dirty = false; hidden.value = ""; wrap.classList.remove("drawn");
      };
    });
  }

  function fmtSize(n) {
    return n >= 1048576 ? (n / 1048576).toFixed(1) + " MB"
                        : Math.max(1, Math.round(n / 1024)) + " KB";
  }

  // A phone photo is 3-5 MB. Nobody should pay for that on a tethered 2G
  // connection to prove they bought a bag of cement. 1600px on the long edge
  // at q0.82 keeps a handwritten receipt legible and lands around 200-400 KB.
  // It also launders HEIC on iOS, where the canvas hands back JPEG, and
  // neutralises an SVG by rasterising it.
  // Every failure path falls back to the original file rather than blocking.
  function shrink(file, cb) {
    var cv = document.createElement("canvas");
    if (file.type === "application/pdf" || !/^image\//.test(file.type) || !cv.toBlob) {
      cb(file, file.type); return;
    }
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onerror = function () { URL.revokeObjectURL(url); cb(file, file.type); };
    img.onload = function () {
      try {
        var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        if (!w || !h) { URL.revokeObjectURL(url); cb(file, file.type); return; }
        var sc = Math.min(1, 1600 / Math.max(w, h));
        cv.width  = Math.max(1, Math.round(w * sc));
        cv.height = Math.max(1, Math.round(h * sc));
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        cv.toBlob(function (b) {
          URL.revokeObjectURL(url);
          if (b && b.size < file.size) cb(b, "image/jpeg"); else cb(file, file.type);
        }, "image/jpeg", 0.82);
      } catch (e) { URL.revokeObjectURL(url); cb(file, file.type); }
    };
    img.src = url;
  }

  function wireFiles() {
    Array.prototype.forEach.call(document.querySelectorAll("[data-upin]"), function (inp) {
      var key    = inp.getAttribute("data-upin");
      var box    = document.querySelector('[data-upwrap="' + key + '"]');
      var show   = document.querySelector('[data-upshow="' + key + '"]');
      var pick   = document.querySelector('[data-uppick="' + key + '"]');
      var hidden = document.querySelector('input[name="' + key + '"]');
      var thumb  = null;

      function drop() { if (thumb) { URL.revokeObjectURL(thumb); thumb = null; } }
      function fail(msg) {
        drop(); hidden.value = ""; inp.value = "";
        box.className = "up bad";
        show.innerHTML = '<p class="uperr">' + esc(msg) + "</p>";
        pick.hidden = false;
      }
      function reset() {
        drop(); hidden.value = ""; inp.value = "";
        box.className = "up"; show.innerHTML = ""; pick.hidden = false;
      }

      pick.onclick = function () {
        // Refuse before the picker even opens. Banking the bytes in
        // localStorage would need base64 (+34%), blow the ~5 MB origin quota
        // on the first photo, and take the whole response queue down with it
        // — every other person's answers included. Say so, in Kreyol, now.
        if (navigator.onLine === false) {
          fail("Ou pa gen entènèt. Fichye a pa ka voye kounye a. " +
               "Chwazi l ankò lè w gen siyal.");
          return;
        }
        inp.click();
      };

      inp.onchange = function () {
        var picked = inp.files && inp.files[0];
        if (!picked) return;
        if (picked.size > 26214400) { fail("Fichye a twò gwo."); return; }
        box.className = "up";
        pick.hidden = true;
        show.innerHTML = '<p class="upmeta">N ap prepare fichye a…</p>';
        shrink(picked, function (blob, mime) { send(picked.name, blob, mime); });
      };

      function send(name, blob, mime) {
        UPLOADING++;
        var spent = false;
        function done() { if (!spent) { spent = true; UPLOADING--; } }

        drop();
        if (/^image\//.test(mime)) thumb = URL.createObjectURL(blob);
        show.innerHTML =
          '<div class="uprow">' +
          (thumb ? '<img class="upthumb" src="' + thumb + '" alt="">'
                 : '<span class="upthumb">PDF</span>') +
          '<div class="upmeta"><span class="nm">' + esc(name) + "</span>" +
          '<span data-upst="' + esc(key) + '">N ap voye… 0%</span>' +
          '<div class="upbar"><span data-upbar="' + esc(key) + '"></span></div>' +
          "</div></div>";
        var st  = show.querySelector('[data-upst="' + key + '"]');
        var bar = show.querySelector('[data-upbar="' + key + '"]');

        // XMLHttpRequest, not fetch: fetch has no upload progress event, and on
        // a 2G tether a progress bar is the difference between waiting and
        // force-quitting the browser.
        ask("upload", { key: key, name: name, type: mime, size: blob.size })
          .then(function (o) {
            if (!o.ok) { done(); fail(o.j.error || "Voye fichye a pa mache."); return; }
            var xhr = new XMLHttpRequest();
            xhr.open("PUT", o.j.url, true);
            xhr.setRequestHeader("Content-Type", o.j.mime);
            xhr.upload.onprogress = function (e) {
              if (!e.lengthComputable) return;
              var p = Math.round((e.loaded / e.total) * 100);
              bar.style.width = p + "%";
              st.textContent = "N ap voye… " + p + "%";
            };
            xhr.onload = function () {
              done();
              if (xhr.status < 200 || xhr.status >= 300) {
                fail("Voye fichye a pa mache. Tanpri eseye ankò."); return;
              }
              hidden.value = JSON.stringify({ path: o.j.path });
              box.className = "up on";
              bar.style.width = "100%";
              st.textContent = fmtSize(blob.size) + " · voye ✓";
              var x = document.createElement("button");
              x.type = "button"; x.className = "x"; x.textContent = "Retire";
              x.onclick = reset;
              show.querySelector(".uprow").appendChild(x);
            };
            xhr.onerror = xhr.ontimeout = function () {
              done();
              fail("Koneksyon an koupe. Tanpri eseye ankò lè w gen siyal.");
            };
            xhr.send(blob);
          })
          .catch(function () {
            done();
            fail("Ou pa gen entènèt. Fichye a pa ka voye kounye a. " +
                 "Chwazi l ankò lè w gen siyal.");
          });
      }
    });
  }

  function note(cls, msg) {
    var n = document.getElementById("note");
    if (!n) return;
    n.className = "note " + cls; n.textContent = msg; n.hidden = false;
    window.scrollTo(0,0);
  }
  function showQueue() {
    var n = qread().length;
    if (n) note("warn", n===1
      ? "Gen 1 repons ki sove sou telefòn nan. N ap voye l lè entènèt la tounen."
      : "Gen "+n+" repons ki sove sou telefòn nan. N ap voye yo lè entènèt la tounen.");
  }

  // The hidden input holds JSON so the queued payload is a real object rather
  // than a string that has to be parsed twice. "" means nothing was attached.
  function filePick(v) {
    if (!v) return "";
    try { return JSON.parse(v); } catch (e) { return ""; }
  }

  function collect() {
    var f = document.getElementById("f");
    var fd = new FormData(f);
    var out = { website: fd.get("website") || "" };
    (DEF.schema.sections||[]).forEach(function (sec) {
      (sec.fields||[]).forEach(function (fl) {
        out[fl.key] = fl.type === "checkbox" ? fd.getAll(fl.key)
                    : fl.type === "file"     ? filePick(fd.get(fl.key))
                    : fl.type === "group"    ? collectGroup(fl)
                    : (fd.get(fl.key) || "");
      });
    });
    return out;
  }

  function done(o) {
    document.getElementById("f").hidden = true;
    var res = document.getElementById("res");
    res.hidden = false;
    // THREE states. A scored form with no pass mark returns pase === null,
    // and the old two-branch version painted that red and called it a fail.
    // A gate that only wants to know whether somebody read the page must not
    // look like a rejection.
    var head = o.esko == null ? "✓"
      : '<span class="'+(o.pase === true ? "pass" : o.pase === false ? "fail" : "")+'">'+
        o.esko+"%</span>";

    // Name the questions they lost, never the options. Send 0's first cohort
    // had one candidate attempt five times and never learn which question was
    // costing them, so the retries could not converge on anything.
    var miss = "";
    if (o.manke && o.manke.length) {
      miss = '<p class="msg" style="text-align:left">Gade kesyon sa yo ankò:</p><ul class="manke">' +
        o.manke.map(function (m) { return "<li>" + esc(m) + "</li>"; }).join("") + "</ul>";
    }

    res.innerHTML = '<p class="big">'+head+"</p>" +
      '<p class="msg">'+esc(o.msg)+"</p>" + miss +
      '<a class="again" href="">← Reponn ankò</a>';
    window.scrollTo(0,0);
  }

  function banked() {
    document.getElementById("f").hidden = true;
    var res = document.getElementById("res");
    res.hidden = false;
    res.innerHTML = '<p class="big">✓</p><p class="msg">Repons ou sove sou telefòn nan.<br>' +
      "N ap voye l otomatikman lè entènèt la tounen.</p>" +
      '<a class="again" href="">← Reponn pou yon lòt moun</a>';
    window.scrollTo(0,0);
  }

  // Browsers skip constraint validation on hidden inputs, so a required
  // signature or rating never triggers the native "please fill this in".
  // Check them here or the person only finds out after a round trip.
  // A group's inputs carry no native `required` (see addRow), so its rows are
  // checked here too: the minimum row count, then one row's gaps at a time.
  function missingHidden() {
    var out = [];
    (DEF.schema.sections || []).forEach(function (sec) {
      (sec.fields || []).forEach(function (f) {
        if (!siOk(siFor(f, sec))) return;   // hidden: not asked, not required
        if (f.type === "group") {
          var min = f.min == null ? 0 : +f.min;
          var rows = groupRows(f);
          var filled = rows.filter(function (r) { return !r.blank; });
          if (filled.length < min) {
            out.push((f.label || f.key) + " — ou bezwen omwen " + min + " " +
              (f.row_label || "liy").toLowerCase());
            return;
          }
          for (var i = 0; i < rows.length; i++) {
            if (rows[i].blank) continue;
            var bad = [];
            (f.fields || []).forEach(function (c) {
              if (c.required && String(rows[i].v[c.key] || "").trim() === "") bad.push(c.label || c.key);
            });
            if (bad.length) { out.push((f.row_label || "Liy") + " " + rows[i].n + ": " + bad.join(", ")); return; }
          }
          return;
        }
        if (!f.required) return;
        if (f.type !== "signature" && f.type !== "rating" && f.type !== "file") return;
        var el = document.querySelector('input[name="' + f.key + '"]');
        if (!el || !el.value) out.push(f.label || f.key);
      });
    });
    return out;
  }

  function submit(e) {
    e.preventDefault();
    var btn = document.getElementById("btn");
    document.getElementById("note").hidden = true;

    // Submitting mid-upload would post a path the server has not seen bytes
    // for, the response would be rejected on the merits, and the queue drops
    // 4xx. Hold the person for the few seconds instead.
    if (UPLOADING > 0) {
      note("warn", "Tann yon ti moman — gen yon fichye k ap voye toujou.");
      return;
    }

    var manke = missingHidden();
    if (manke.length) {
      note("err", "Ou bezwen ranpli: " + manke.join(", "));
      return;
    }

    btn.disabled = true; btn.textContent = "N ap voye…";
    var payload = collect();

    function reset(){ btn.disabled=false; btn.textContent = DEF.schema.submit_label||"Voye"; }

    if (navigator.onLine === false) {
      if (qpush(payload)) { sonjeSave(payload); banked(); } else { note("err","Pa gen plas pou sove repons lan."); reset(); }
      return;
    }
    post(payload).then(function (o) {
      if (!o.ok) { note("err", o.j.error || "Gen yon pwoblèm."); reset(); return; }
      sonjeSave(payload);
      done(o.j);
    }).catch(function () {
      if (qpush(payload)) { sonjeSave(payload); banked(); } else { note("err","Koneksyon an pa mache."); reset(); }
    });
  }

  // ---------------------------- boot ----------------------------
  if (!slug) { wrap.innerHTML = '<div class="center">Pa gen fòm ki chwazi.</div>'; return; }

  window.addEventListener("online", flush);
  flush();

  fetch(API + "/" + encodeURIComponent(slug))
    .then(function (r) { return r.json().then(function (j) { return {ok:r.ok, j:j}; }); })
    .then(function (o) {
      if (!o.ok) { wrap.innerHTML = '<div class="center">'+esc(o.j.error)+"</div>"; return; }
      DEF = o.j;
      if (DEF.eta === "feme") { wrap.innerHTML = '<div class="center">Fòm sa a fèmen.</div>'; return; }
      // A quiz is the same row drawn a different way: paged, marked question
      // by question, and bilingual if the schema carries a French overlay.
      if (DEF.schema && DEF.schema.kiz) {
        if (!bilingual()) L = "kr";
        buildKiz(); kizShell(); drawStep();
        return;
      }
      renderForm(DEF);
      if (DEF.eta === "bouyon") note("warn", "BOUYON — fòm sa a poko louvri. Repons yo p ap anrejistre.");
    })
    .catch(function () {
      wrap.innerHTML = '<div class="center">Koneksyon an pa mache. Tcheke entènèt ou.</div>';
    });
})();
</script>
</body>
